<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>習慣記録</title>
<style>
:root{
  --bg:#1C1C1E;
  --card:#48484A;
  --dot-empty:#30343A;
  --text:#FFFFFF;
  --sub:#A0A4A8;
}

*{ box-sizing:border-box; }

html{ background:var(--bg); }

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  padding:
    calc(env(safe-area-inset-top) + 14px)
    calc(env(safe-area-inset-right) + 14px)
    calc(env(safe-area-inset-bottom) + 14px)
    calc(env(safe-area-inset-left) + 14px);
}

/* --- ホーム画面：2列のカード --- */
#habit-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:12px 12px 14px;
}

/* 7列 × 5行 = 35マス。左上が今日、右・下へ進むほど過去 */
.dots{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.dot{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  width:100%;
  padding:0;
  border:0;
  aspect-ratio:1 / 1;
  border-radius:3px;
  background:var(--dot-empty);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.dot.is-done{ background:var(--habit-color); }

/* 今日のマスに記録が無いとき … 塗りつぶさず、破線の枠 */
.dot.is-today-open{
  background:transparent;
  border:1.5px dashed var(--habit-color);
}

/* 記録が付いたときだけ、少し膨らんで戻る */
@keyframes dot-pop{
  0%   { transform:scale(1); }
  45%  { transform:scale(1.35); }
  100% { transform:scale(1); }
}

.dot.is-pop{ animation:dot-pop 260ms ease-out; }

.card .count{
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:15px;
  font-weight:700;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}

/* 炎アイコン。今日の記録の有無で色が変わるので絵文字は使わない。 */
.flame{
  flex:0 0 auto;
  width:15px;
  height:15px;
  display:block;
}

.card .name{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  width:100%;
  border:0;
  background:transparent;
  padding:0;
  font-family:inherit;
  cursor:pointer;
  margin-top:3px;
  text-align:center;
  font-size:12px;
  line-height:1.3;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* --- 7節 カード一覧の最後に並べる「＋」のカード（点線枠） --- */
.add-card{
  appearance:none;
  -webkit-appearance:none;
  border:1px dashed rgba(255,255,255,0.28);
  border-radius:16px;
  background:transparent;
  color:var(--sub);
  font-family:inherit;
  font-size:30px;
  line-height:1;
  min-height:120px;
  cursor:pointer;
}

/* --- 7節 習慣の入力 --- */
.field{ margin-bottom:16px; }

.field-label{
  display:block;
  margin-bottom:7px;
  color:var(--sub);
  font-size:12px;
}

.text-input{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:inherit;
  font-size:15px;
}

.color-row{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.color-swatch{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  padding:0;
  aspect-ratio:1 / 1;
  border-radius:50%;
  cursor:pointer;
}

.color-swatch.is-selected{
  outline:2px solid var(--text);
  outline-offset:2px;
}

/* 開始日のボタン（カレンダーを開く） */
.date-field{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  padding:12px;
  text-align:center;
  cursor:pointer;
}

#habit-error{
  margin:0 0 12px;
  color:#E5484D;
  font-size:13px;
}

#habit-actions{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,0.12);
}

/* --- 7節 並び替え専用の一覧 --- */
.reorder-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

.reorder-name{
  flex:1;
  min-width:0;
  font-size:15px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.reorder-step{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 auto;
  border:0;
  border-radius:9px;
  width:40px;
  height:40px;
  background:var(--bg);
  color:var(--text);
  font-size:17px;
  line-height:1;
  cursor:pointer;
}

.reorder-step:disabled{ opacity:0.3; cursor:default; }

#reorder-empty{
  color:var(--sub);
  font-size:13px;
}

/* --- 7節 達成済み一覧 --- */
.arch-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

.arch-dot{
  flex:0 0 auto;
  width:14px;
  height:14px;
  border-radius:4px;
}

.arch-body{ flex:1; min-width:0; }

.arch-name{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  border:0;
  background:transparent;
  padding:0;
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
}

.arch-meta{
  margin-top:3px;
  color:var(--sub);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}

.arch-restore{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 auto;
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:var(--bg);
  color:var(--text);
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

#archived-empty{
  color:var(--sub);
  font-size:13px;
}

/* --- 6節 詳細画面（履歴） --- */
#detail-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

#detail-name{
  margin:0;
  flex:1;
  min-width:0;
  font-size:17px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

#detail-summary{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}

#detail-status{
  color:var(--sub);
  font-size:13px;
}

#detail-daynumber{
  font-size:15px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* タイムライン */
/* 記録1件ごとを角丸のカードで囲む */
.tl-row{
  position:relative;
  margin-bottom:14px;
}

/* 縦線は「連続」を意味する。
   連続した日の記録どうしの間にだけ引く。間が空いていれば引かない。 */
.tl-row.is-linked{ margin-bottom:8px; }

.tl-row.is-linked::after{
  content:'';
  position:absolute;
  left:27px;
  top:100%;
  height:8px;
  width:2px;
  background:var(--habit-color);
}

.tl-row.is-last{ margin-bottom:0; }

.tl-card{
  display:flex;
  align-items:flex-start;
  gap:12px;
  background:var(--card);
  border-radius:12px;
  padding:12px;
}

.tl-badge{
  flex:0 0 auto;
  width:32px;
  height:32px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

.tl-body{
  flex:1;
  min-width:0;
  padding-top:2px;
}

.tl-line{
  display:flex;
  align-items:baseline;
  gap:12px;
}

.tl-date{
  font-size:14px;
  font-variant-numeric:tabular-nums;
}

.tl-dayno{
  color:var(--sub);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}

.tl-memo{
  margin-top:4px;
  color:var(--sub);
  font-size:13px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.tl-more{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 auto;
  border:0;
  background:transparent;
  color:var(--sub);
  font-size:18px;
  line-height:1;
  padding:4px 6px;
  cursor:pointer;
}

#detail-empty{
  color:var(--sub);
  font-size:13px;
}

#detail-more{ margin-top:4px; }

/* 「＋」は画面下部に固定する。
   記録が214件ある習慣でも、末尾までスクロールせずに押せるように。 */
#detail-view{
  padding-bottom:96px;
}

#detail-add{
  appearance:none;
  -webkit-appearance:none;
  position:fixed;
  right:calc(env(safe-area-inset-right) + 18px);
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  z-index:15;
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  background:var(--habit-color);
  color:var(--habit-ink);
  font-family:inherit;
  font-size:26px;
  line-height:1;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.45);
}

/* --- 6節 記録の入力（日付を選んで追加・編集） --- */
.date-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}

.date-step{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 auto;
  border:0;
  border-radius:10px;
  width:40px;
  height:40px;
  background:var(--bg);
  color:var(--text);
  font-size:18px;
  line-height:1;
  cursor:pointer;
}

.date-step:disabled{ opacity:0.35; cursor:default; }

/* 日付そのものをタップすると、その場に月カレンダーが開く */
.date-display{
  appearance:none;
  -webkit-appearance:none;
  flex:1;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--text);
  text-align:center;
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  padding:10px 0;
  cursor:pointer;
}

/* --- アプリ内の月カレンダー --- */
#entry-calendar{
  margin-bottom:14px;
  background:var(--bg);
  border-radius:12px;
  padding:10px;
}

.cal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}

#cal-title{
  font-size:14px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}

.cal-nav{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  border-radius:8px;
  width:32px;
  height:32px;
  background:transparent;
  color:var(--text);
  font-size:17px;
  line-height:1;
  cursor:pointer;
}

.cal-nav:disabled{ opacity:0.3; cursor:default; }

.cal-weekdays,
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
}

.cal-weekdays{
  margin-bottom:3px;
}

.cal-weekdays span{
  text-align:center;
  color:var(--sub);
  font-size:11px;
  line-height:20px;
}

.cal-day{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  padding:0;
  aspect-ratio:1 / 1;
  border-radius:7px;
  background:var(--dot-empty);
  color:var(--text);
  font-family:inherit;
  font-size:13px;
  font-variant-numeric:tabular-nums;
  cursor:pointer;
}

/* 今日より先の日は選べない */
.cal-day.is-future{
  opacity:0.3;
  cursor:default;
}

.cal-day.is-selected{
  outline:2px solid var(--text);
  outline-offset:-2px;
}

#entry-memo{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:inherit;
  font-size:15px;
  line-height:1.5;
  resize:vertical;
}

.danger-button{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:8px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:transparent;
  color:#E5484D;
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

/* --- 5節 過去のマスをタップしたときの案内 --- */
#toast{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 78px);
  z-index:25;
  display:flex;
  justify-content:center;
  padding:0 16px;
  pointer-events:none;
}

#toast span{
  background:var(--card);
  color:var(--text);
  border-radius:999px;
  padding:11px 20px;
  font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,0.45);
  animation:band-in 180ms ease-out;
}

/* --- 8節 設定画面 --- */
#home-head{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}

.icon-button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-size:20px;
  line-height:1;
  padding:6px 4px;
  cursor:pointer;
}

.screen-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.screen-head h1{
  margin:0;
  font-size:17px;
  font-weight:600;
}

.text-button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-family:inherit;
  font-size:15px;
  padding:4px 0;
  cursor:pointer;
}

#open-archived{ margin-bottom:30px; }

#settings-view h2{
  margin:0 0 16px;
  font-size:15px;
  font-weight:600;
}

.backup-block{
  margin-bottom:28px;
}

.backup-block h3{
  margin:0 0 4px;
  font-size:14px;
  font-weight:600;
}

.hint{
  margin:0 0 10px;
  color:var(--sub);
  font-size:12px;
  line-height:1.5;
}

#export-text,
#import-text{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  line-height:1.5;
  resize:vertical;
}

.wide-button{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

#import-message{
  margin:12px 0 0;
  font-size:13px;
  line-height:1.5;
}

#import-message.is-ok    { color:#3FC57D; }
#import-message.is-error { color:#E5484D; }

/* --- 5節 「メモを追加」の帯 --- */
#memo-band{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  z-index:20;
  display:flex;
  justify-content:center;
  padding:0 16px;
  pointer-events:none;
}

.band-button{
  appearance:none;
  -webkit-appearance:none;
  pointer-events:auto;
  border:0;
  border-radius:999px;
  padding:13px 26px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.45);
  animation:band-in 180ms ease-out;
}

@keyframes band-in{
  from{ opacity:0; transform:translateY(10px); }
  to  { opacity:1; transform:none; }
}

/* --- 5節 メモ入力欄 --- */
#memo-sheet,
#entry-sheet,
#habit-sheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.sheet-backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

.sheet-panel{
  position:relative;
  background:var(--card);
  border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  animation:sheet-in 200ms ease-out;
  /* カレンダーを開くと縦に伸びるので、小さい画面でもボタンに届くようにする */
  max-height:100vh;
  overflow-y:auto;
}

@keyframes sheet-in{
  from{ transform:translateY(100%); }
  to  { transform:none; }
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.sheet-head h2{
  margin:0;
  font-size:16px;
  font-weight:600;
}

.sheet-close{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-family:inherit;
  font-size:22px;
  line-height:1;
  padding:4px 8px;
  cursor:pointer;
}

#memo-text{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:inherit;
  font-size:15px;
  line-height:1.5;
  resize:vertical;
}

.sheet-done{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--bg);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

/* prefers-reduced-motion を尊重する */
@media (prefers-reduced-motion: reduce){
  .dot.is-pop,
  .band-button,
  .sheet-panel,
  #toast span{
    animation:none;
  }
}

[hidden]{ display:none !important; }
</style>
</head>
<body>

<main>
  <div id="home-view">
    <div id="home-head">
      <button type="button" class="icon-button" id="open-settings" aria-label="設定">⚙</button>
    </div>
    <div id="habit-grid"></div>
  </div>

  <!-- 6節 詳細画面（履歴） -->
  <section id="detail-view" hidden>
    <div id="detail-head">
      <button type="button" class="text-button" id="close-detail">← 戻る</button>
      <h1 id="detail-name"></h1>
      <button type="button" class="icon-button" id="detail-settings" aria-label="習慣の設定">⚙</button>
    </div>

    <div id="detail-summary">
      <span id="detail-status"></span>
      <span id="detail-daynumber"></span>
    </div>

    <div id="detail-list"></div>
    <p id="detail-empty" hidden>まだ記録がありません。</p>
    <button type="button" class="wide-button" id="detail-more" hidden>もっと見る</button>

    <button type="button" id="detail-add">＋</button>
  </section>

  <!-- 7節 並び替え専用の一覧 -->
  <section id="reorder-view" hidden>
    <div class="screen-head">
      <button type="button" class="text-button" id="close-reorder">← 戻る</button>
      <h1>並び替え</h1>
    </div>
    <div id="reorder-list"></div>
    <p id="reorder-empty" hidden>稼働中の習慣がありません。</p>
  </section>

  <!-- 7節 達成済み一覧 -->
  <section id="archived-view" hidden>
    <div class="screen-head">
      <button type="button" class="text-button" id="close-archived">← 戻る</button>
      <h1>達成済み</h1>

<script>
'use strict';

/* =========================================================
   2節 データ
   ========================================================= */

const STORAGE_KEY = 'habit.v1';

/* 7節 DotHabit と同じ7色 */
const COLORS = ['#3FC57D','#5AAFE2','#E5484D','#EC5E9F','#EDC24B','#0596A6','#8B84D7'];

/* 4節 7列 × 5行 = 35マス */
const DOT_COLS  = 7;
const DOT_ROWS  = 5;
const DOT_COUNT = DOT_COLS * DOT_ROWS;

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

/* 4節 今日まだ記録が無いときの炎の色 */
const FLAME_OFF = '#6B7076';

const SVG_NS = 'http://www.w3.org/2000/svg';
const FLAME_PATH =
  'M13.4 1.4c.2 2.8 1.5 4.2 3 5.9 1.4 1.7 2.6 3.5 2.6 5.9 0 3.9-3.1 7.4-7 7.4'
  + 's-7-3.5-7-7.4c0-2 .8-3.7 2-5.1.1 1.4.7 2.3 1.6 2.6.6.2 1.1-.3.9-1'
  + '-.8-3 .4-6.1 3.9-8.3Z';

/* =========================================================
   日付ヘルパ
   日付は必ずローカル時刻で YYYY-MM-DD を作る。
   toISOString() は UTC になるため使用禁止。
   ========================================================= */

function pad2(n){
  return n < 10 ? '0' + n : String(n);
}

function dateKey(date){
  return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
}

function parseDate(key){
  const y = Number(key.slice(0, 4));
  const m = Number(key.slice(5, 7));
  const d = Number(key.slice(8, 10));
  return new Date(y, m - 1, d);
}

function startOfDay(date){
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function today(){
  return startOfDay(new Date());
}

function addDays(date, n){
  const d = startOfDay(date);
  d.setDate(d.getDate() + n);
  return d;
}

const WEEKDAYS = ['日','月','火','水','木','金','土'];

/* 例: 2026年9月4日（金） */
function formatDateJa(key){
  const d = parseDate(key);
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'
    + '（' + WEEKDAYS[d.getDay()] + '）';
}

/* b - a を日数で返す */
function daysBetween(a, b){
  const ms = startOfDay(b).getTime() - startOfDay(a).getTime();
  return Math.round(ms / 86400000);
}

/* =========================================================
   3節 計算ルール
   すべて日付の文字列比較ではなく、日付オブジェクトで計算する
   ========================================================= */

function hasRecord(habit, key){
  return Object.prototype.hasOwnProperty.call(habit.records, key);
}

/* 累計完了日数 … records の件数 */
function totalDays(habit){
  return Object.keys(habit.records).length;
}

/* 通算日数（◯日目） … (今日 - startDate).days + 1。開始日が1日目 */
function dayNumber(habit, ref){
  return daysBetween(parseDate(habit.startDate), ref || today()) + 1;
}

/* 連続日数 … その日で終わる連続記録の長さ。前日に記録が無ければ 1 */
function streakEndingOn(habit, date){
  let n = 0;
  let d = startOfDay(date);
  while (hasRecord(habit, dateKey(d))) {
    n += 1;
    d = addDays(d, -1);
  }
  return n;
}

/* 現在の連続日数 … 今日に記録があれば今日から遡って数える。
   無ければ前日から遡る（朝に 0 と出さないため） */
function currentStreak(habit, ref){
  const base = ref || today();
  if (hasRecord(habit, dateKey(base))) return streakEndingOn(habit, base);
  return streakEndingOn(habit, addDays(base, -1));
}

/* 記録のある最終日 */
function lastRecordedDate(habit){
  const keys = Object.keys(habit.records);
  if (keys.length === 0) return null;
  let max = keys[0];
  for (const key of keys) {
    if (parseDate(key) > parseDate(max)) max = key;
  }
  return max;
}

/* =========================================================
   取り込みデータの正規化
   8節 … 2つの形式を受け付ける
     1. アプリ自身が書き出した形式（records が日付をキーにしたオブジェクト）
     2. 移行データの形式（records が日付文字列の配列。メモは無い）
   このアプリに無い項目が入っていても無視する。
   ========================================================= */

function normalizeRecords(records){
  const out = {};
  if (Array.isArray(records)) {
    for (const key of records) {
      if (typeof key === 'string' && DATE_RE.test(key)) out[key] = '';
    }
    return out;
  }
  if (records && typeof records === 'object') {
    for (const key of Object.keys(records)) {
      if (!DATE_RE.test(key)) continue;
      const memo = records[key];
      out[key] = typeof memo === 'string' ? memo : '';
    }
    return out;
  }
  return out;
}

function normalizeHabit(raw, index){
  const source = raw && typeof raw === 'object' ? raw : {};
  const archived = source.archived === true;

  const habit = {
    id: typeof source.id === 'string' && source.id ? source.id : 'h' + (index + 1),
    name: typeof source.name === 'string' ? source.name : '',
    color: typeof source.color === 'string' && /^#[0-9A-Fa-f]{6}$/.test(source.color)
      ? source.color
      : COLORS[0],
    startDate: typeof source.startDate === 'string' && DATE_RE.test(source.startDate)
      ? source.startDate
      : dateKey(today()),
    order: typeof source.order === 'number' && isFinite(source.order) ? source.order : index,
    archived: archived,
    completedDate: null,
    records: normalizeRecords(source.records)
  };

  /* 達成日 … 達成済みにした時点で、記録のある最終日 */
  if (archived) {
    habit.completedDate =
      typeof source.completedDate === 'string' && DATE_RE.test(source.completedDate)
        ? source.completedDate
        : lastRecordedDate(habit);
  }

  return habit;
}

function normalizeState(data){
  if (!data || typeof data !== 'object' || !Array.isArray(data.habits)) {
    throw new Error('habits が見つかりません');
  }
  return {
    version: 1,
    habits: data.habits.map(normalizeHabit)
  };
}

function emptyState(){
  return { version: 1, habits: [] };
}

/* =========================================================
   保存先 localStorage、キーは habit.v1
   読み書きは必ず try/catch で囲む
   （プライベートブラウズ等で例外が出る）
   ========================================================= */

function loadState(){
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    console.warn('localStorage を読めませんでした', e);
    return emptyState();
  }
  if (!raw) return emptyState();
  try {
    return normalizeState(JSON.parse(raw));
  } catch (e) {
    console.warn('保存データを読めませんでした', e);
    return emptyState();
  }
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('localStorage に保存できませんでした', e);
  }
}

/* =========================================================
   4節 ホーム画面
   ========================================================= */

let state = emptyState();

/* 稼働中の習慣（archived: false）だけを order 順に */
function activeHabits(){
  return state.habits
    .filter(function(habit){ return !habit.archived; })
    .sort(function(a, b){ return a.order - b.order; });
}

/* マスの並び（重要）
   これはカレンダーではない。曜日は揃えない。
   左上が今日。右へ進むごとに1日ずつ過去へ、行末まで行ったら次の行の左端へ続く。
   i 番目のマス（0始まり、左上から右下へ）は 今日 - i 日。右下が34日前。 */
function buildDots(habit, base){
  const dots = document.createElement('div');
  dots.className = 'dots';

  for (let i = 0; i < DOT_COUNT; i++) {
    const key = dateKey(addDays(base, -i));

    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'dot';
    dot.dataset.date = key;
    dot.setAttribute('aria-label', formatDateJa(key));

    if (hasRecord(habit, key)) {
      dot.classList.add('is-done');
    } else if (i === 0) {
      /* 今日のマスに記録が無いとき … 塗りつぶさず、color の破線の枠 */
      dot.classList.add('is-today-open');
    }

    dots.appendChild(dot);
  }

  return dots;
}

/* 炎アイコン。色は fill="currentColor" 越しに差し替える */
function buildFlame(){
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('class', 'flame');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');

  const path = document.createElementNS(SVG_NS, 'path');
  path.setAttribute('d', FLAME_PATH);
  path.setAttribute('fill', 'currentColor');
  svg.appendChild(path);

  return svg;
}

/* 今日すでに記録があれば習慣の色、まだなら グレー */
function paintFlame(card, habit, todayKey){
  card.querySelector('.flame').style.color =
    hasRecord(habit, todayKey) ? habit.color : FLAME_OFF;
}

function buildCard(habit, base){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.habitId = habit.id;
  card.style.setProperty('--habit-color', habit.color);

  card.appendChild(buildDots(habit, base));

  const count = document.createElement('div');
  count.className = 'count';
  count.appendChild(buildFlame());

  const total = document.createElement('span');
  total.className = 'total';
  total.textContent = totalDays(habit);
  count.appendChild(total);

  card.appendChild(count);

  /* 習慣名をタップすると詳細画面（6節） */
  const name = document.createElement('button');
  name.type = 'button';
  name.className = 'name';
  name.dataset.habitId = habit.id;
  name.textContent = habit.name;
  card.appendChild(name);

  paintFlame(card, habit, dateKey(base));

  return card;
}

function render(){
  const grid = document.getElementById('habit-grid');
  const base = today();

  grid.textContent = '';
  for (const habit of activeHabits()) grid.appendChild(buildCard(habit, base));

  /* カード一覧の最後に「＋」のカードを並べる。
     習慣が0件のときは、これだけが画面に出る。 */
  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'add-card';
  add.id = 'add-habit';
  add.setAttribute('aria-label', '習慣を追加');
  add.textContent = '＋';
  grid.appendChild(add);
}

/* カード1枚だけを描き直す。
   ホーム画面に留まったまま更新するので、画面遷移は起こらない。 */
function refreshCard(card, habit){
  const base = today();
  const dots = card.querySelectorAll('.dot');

  for (let i = 0; i < dots.length; i++) {
    const key = dateKey(addDays(base, -i));
    const done = hasRecord(habit, key);
    dots[i].classList.toggle('is-done', done);
    dots[i].classList.toggle('is-today-open', !done && i === 0);
  }

  card.querySelector('.total').textContent = totalDays(habit);
  paintFlame(card, habit, dateKey(base));
}

function findHabit(id){
  for (const habit of state.habits) {
    if (habit.id === id) return habit;
  }
  return null;
}

/* =========================================================
   5節 「メモを追加」の帯
   記録が付いた直後に約4秒出る。押さなければ静かに消える。
   ========================================================= */

const BAND_MS = 4000;

let bandTarget = null;   /* { habitId, key } */
let bandTimer = null;

function showBand(habitId, key){
  /* 帯が出ている間に別のマスをタップしたら、対象を新しい記録に差し替える */
  bandTarget = { habitId: habitId, key: key };

  if (bandTimer !== null) clearTimeout(bandTimer);
  document.getElementById('memo-band').hidden = false;
  bandTimer = setTimeout(hideBand, BAND_MS);
}

function hideBand(){
  if (bandTimer !== null) {
    clearTimeout(bandTimer);
    bandTimer = null;
  }
  bandTarget = null;
  document.getElementById('memo-band').hidden = true;
}

/* =========================================================
   5節 メモ入力欄
   日付の見出し、複数行のテキスト欄、「完了」ボタン
   ========================================================= */

let memoTarget = null;     /* { habitId, key } */
let memoOpenedWith = '';   /* 開いたときのテキスト欄の内容 */

function openMemo(){
  if (bandTarget === null) return;

  const target = bandTarget;
  const habit = findHabit(target.habitId);

  hideBand();

  /* 帯を押すまでの間に記録が外されていたら開かない */
  if (habit === null || !hasRecord(habit, target.key)) return;

  memoTarget = target;
  document.getElementById('memo-title').textContent = formatDateJa(target.key);

  const text = document.getElementById('memo-text');
  text.value = habit.records[target.key];
  memoOpenedWith = text.value;

  document.getElementById('memo-sheet').hidden = false;
  text.focus();
}

function closeMemoSheet(){
  memoTarget = null;
  memoOpenedWith = '';
  document.getElementById('memo-sheet').hidden = true;
}

/* 「完了」以外で閉じるとき。
   開いたときの内容から変更されている場合だけ確認を出す。
   保存済みメモを開いて何も変えずに閉じるときは確認しない。 */
function cancelMemo(){
  if (memoTarget !== null && document.getElementById('memo-text').value !== memoOpenedWith) {
    const ok = window.confirm('書きかけのメモは保存されません。よろしいですか？');
    if (!ok) return;
  }
  closeMemoSheet();
}

/* 「完了」… メモを記録に書き込む */
function saveMemo(){
  if (memoTarget !== null) {
    const habit = findHabit(memoTarget.habitId);
    if (habit !== null && hasRecord(habit, memoTarget.key)) {
      habit.records[memoTarget.key] = document.getElementById('memo-text').value;
      saveState();
    }
  }
  closeMemoSheet();
}

/* =========================================================
   5節 マスのタップ
   その場で記録が付く／外れる。画面遷移は起こさない。
   ========================================================= */

function popDot(dot){
  dot.classList.remove('is-pop');
  void dot.offsetWidth;   /* アニメーションを再生し直すための reflow */
  dot.classList.add('is-pop');
}

function toggleRecord(habit, key, dot, card){
  if (hasRecord(habit, key)) {
    /* すでに記録がある日 … 記録が外れる（トグル）
       メモが入っている場合は、メモも消える旨を確認してから消す */
    const memo = habit.records[key];
    if (memo !== '') {
      const ok = window.confirm(
        formatDateJa(key) + ' の記録を外します。\n' +
        '書いたメモも一緒に消えます。よろしいですか？\n\n' + memo
      );
      if (!ok) return;
    }

    delete habit.records[key];
    saveState();
    refreshCard(card, habit);

    /* 記録を外したときは帯を出さない。
       いま出ている帯がこの記録を指していたら引っ込める */
    if (bandTarget !== null && bandTarget.habitId === habit.id && bandTarget.key === key) {
      hideBand();
    }
    return;
  }

  /* メモ無しは空文字 */
  habit.records[key] = '';
  saveState();
  refreshCard(card, habit);
  popDot(dot);
  showBand(habit.id, key);
}

document.getElementById('habit-grid').addEventListener('click', function(event){
  /* 習慣名 → 詳細画面（6節） */
  const nameButton = event.target.closest('.name');
  if (nameButton !== null) {
    openDetail(nameButton.dataset.habitId);
    return;
  }

  const dot = event.target.closest('.dot');
  if (dot === null) return;

  const card = dot.closest('.card');
  const habit = findHabit(card.dataset.habitId);
  if (habit === null) return;

  /* タップできるのは今日のマスだけ。
     過去のマスはデータを一切変更せず、案内だけ出す。 */
  if (dot.dataset.date !== dateKey(today())) {
    showToast('過去の記録は履歴から追加できます');
    return;
  }

  toggleRecord(habit, dot.dataset.date, dot, card);
});

/* =========================================================
   6節 詳細画面（履歴）
   ========================================================= */

const DETAIL_PAGE = 100;

let detailHabitId = null;
let detailLimit = DETAIL_PAGE;

/* バッジの数字が読める文字色を選ぶ（7色とも使うため） */
function readableOn(color){
  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const b = parseInt(color.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#1C1C1E' : '#FFFFFF';
}

/* 新しい順。文字列比較ではなく日付オブジェクトで並べる */
function recordKeysNewestFirst(habit){
  return Object.keys(habit.records).sort(function(a, b){
    return parseDate(b).getTime() - parseDate(a).getTime();
  });
}

function buildTimelineRow(habit, key, olderKey, isLast){
  const date = parseDate(key);

  const row = document.createElement('div');
  row.className = 'tl-row';
  if (isLast) row.classList.add('is-last');

  /* 連続した日の記録どうしの間にだけ線を引く。
     08/23 と 08/22 は引く。09/04 と 08/31 は引かない。 */
  if (olderKey !== undefined && daysBetween(parseDate(olderKey), date) === 1) {
    row.classList.add('is-linked');
  }

  const inner = document.createElement('div');
  inner.className = 'tl-card';

  /* 左のバッジ＝その日が連続何日目か */
  const badge = document.createElement('div');
  badge.className = 'tl-badge';
  badge.style.background = habit.color;
  badge.style.color = readableOn(habit.color);
  badge.textContent = streakEndingOn(habit, date);
  inner.appendChild(badge);

  const body = document.createElement('div');
  body.className = 'tl-body';

  const line = document.createElement('div');
  line.className = 'tl-line';

  const dateText = document.createElement('span');
  dateText.className = 'tl-date';
  dateText.textContent = key.replace(/-/g, '/');
  line.appendChild(dateText);

  const dayNo = document.createElement('span');
  dayNo.className = 'tl-dayno';
  dayNo.textContent = dayNumber(habit, date) + '日目';
  line.appendChild(dayNo);

  body.appendChild(line);

  const memo = habit.records[key];
  if (memo !== '') {
    const memoText = document.createElement('div');
    memoText.className = 'tl-memo';
    memoText.textContent = memo;
    body.appendChild(memoText);
  }

  inner.appendChild(body);

  /* 右端の「⋯」から、その記録の編集・削除 */
  const more = document.createElement('button');
  more.type = 'button';
  more.className = 'tl-more';
  more.dataset.date = key;
  more.setAttribute('aria-label', formatDateJa(key) + ' の記録を編集');
  more.textContent = '⋯';
  inner.appendChild(more);

  row.appendChild(inner);

  return row;
}

function renderDetail(){
  const habit = findHabit(detailHabitId);
  if (habit === null) {
    showView('home-view');
    return;
  }

  const base = today();
  const todayKey = dateKey(base);

  document.getElementById('detail-name').textContent = habit.name;
  document.getElementById('detail-daynumber').textContent = dayNumber(habit, base) + '日目';

  /* 今日まだ記録が無ければ「今日も完了させましょう！」、
     記録済みなら「◯日連続達成中」 */
  document.getElementById('detail-status').textContent =
    hasRecord(habit, todayKey)
      ? currentStreak(habit, base) + '日連続達成中'
      : '今日も完了させましょう！';

  const keys = recordKeysNewestFirst(habit);
  const shown = keys.slice(0, detailLimit);

  /* つなぐ縦線と「＋」の色 */
  const view = document.getElementById('detail-view');
  view.style.setProperty('--habit-color', habit.color);
  view.style.setProperty('--habit-ink', readableOn(habit.color));

  const list = document.getElementById('detail-list');
  list.textContent = '';
  shown.forEach(function(key, i){
    list.appendChild(buildTimelineRow(habit, key, shown[i + 1], i === shown.length - 1));
  });

  document.getElementById('detail-empty').hidden = keys.length > 0;
  document.getElementById('detail-more').hidden = keys.length <= shown.length;
}

function openDetail(habitId){
  detailHabitId = habitId;
  detailLimit = DETAIL_PAGE;
  renderDetail();
  showView('detail-view');
}

/* --- アプリ内の月カレンダー ---
   iOS Safari では input[type=date] のピッカーが開かない（重ねる方法も
   showPicker() も効かない）ため、カレンダーは自前で描く。 */

let calMonth = null;   /* 表示中の月の1日 */

function monthStart(date){
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

function isCalendarOpen(){
  return !document.getElementById('entry-calendar').hidden;
}

/* 1か月ぶんを描く。記録の入力と、習慣の開始日の両方で使う。
   paintHabit を渡すと、その習慣の記録がある日を習慣の色で塗る。 */
function renderMonthGrid(ids, month, selectedKey, paintHabit){
  const base = today();
  const year = month.getFullYear();
  const monthIndex = month.getMonth();

  document.getElementById(ids.title).textContent = year + '年' + (monthIndex + 1) + '月';

  const grid = document.getElementById(ids.grid);
  grid.textContent = '';

  /* 日〜土の7列に合わせるため、月初の曜日ぶんだけ空ける */
  const leading = new Date(year, monthIndex, 1).getDay();
  for (let i = 0; i < leading; i++) {
    grid.appendChild(document.createElement('span'));
  }

  const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, monthIndex, day);
    const key = dateKey(date);

    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cal-day';
    cell.dataset.date = key;
    cell.textContent = day;

    /* その習慣の記録がある日は、習慣の色で塗る */
    if (paintHabit && hasRecord(paintHabit, key)) {
      cell.style.background = paintHabit.color;
      cell.style.color = readableOn(paintHabit.color);
    }

    /* 今日より先の日は選べない */
    if (daysBetween(base, date) > 0) {
      cell.disabled = true;
      cell.classList.add('is-future');
    }

    if (key === selectedKey) cell.classList.add('is-selected');

    grid.appendChild(cell);
  }

  /* 今月より先の月へは進めない */
  document.getElementById(ids.next).disabled =
    (year === base.getFullYear() && monthIndex === base.getMonth());
}

const ENTRY_CAL = { title: 'cal-title', grid: 'cal-grid', next: 'cal-next' };

function renderCalendar(){
  const habit = findHabit(entryHabitId);
  if (habit === null || calMonth === null) return;
  renderMonthGrid(ENTRY_CAL, calMonth, entryDate, habit);
}

function openCalendar(){
  calMonth = monthStart(parseDate(entryDate));
  renderCalendar();
  document.getElementById('entry-calendar').hidden = false;
  document.getElementById('entry-date-button').setAttribute('aria-expanded', 'true');
}

function closeCalendar(){
  document.getElementById('entry-calendar').hidden = true;
  document.getElementById('entry-date-button').setAttribute('aria-expanded', 'false');
}

function shiftCalMonth(months){
  const next = new Date(calMonth.getFullYear(), calMonth.getMonth() + months, 1);
  if (next > monthStart(today())) return;
  calMonth = next;
  renderCalendar();
}

function syncEntry(){
  const habit = findHabit(entryHabitId);
  if (habit === null) return;

  const todayKey = dateKey(today());
  const exists = hasRecord(habit, entryDate);

  document.getElementById('entry-date-label').textContent = formatDateJa(entryDate);
  document.getElementById('entry-next').disabled = (entryDate === todayKey);

  /* すでに記録がある日は、その日のメモを読み込んでボタンを「保存」に変える */
  const memo = document.getElementById('entry-memo');
  memo.value = exists ? habit.records[entryDate] : '';
  entryOpenedWith = memo.value;

  document.getElementById('entry-heading').textContent = exists ? '記録を編集' : '記録を追加';

  const save = document.getElementById('entry-save');
  save.textContent = exists ? '保存' : '完了';
  save.style.background = habit.color;
  save.style.color = readableOn(habit.color);

  document.getElementById('entry-delete').hidden = !exists;

  if (isCalendarOpen()) {
    calMonth = monthStart(parseDate(entryDate));
    renderCalendar();
  }
}

function openEntry(habitId, key){
  entryHabitId = habitId;
  entryDate = key;
  closeCalendar();
  syncEntry();
  document.getElementById('entry-sheet').hidden = false;
}

function closeEntrySheet(){
  entryHabitId = null;
  entryDate = null;
  entryOpenedWith = '';
  closeCalendar();
  document.getElementById('entry-sheet').hidden = true;
}

function cancelEntry(){
  if (entryDate !== null && document.getElementById('entry-memo').value !== entryOpenedWith) {
    const ok = window.confirm('書きかけのメモは保存されません。よろしいですか？');
    if (!ok) return;
  }
  closeEntrySheet();
}

/* 矢印で1日ずつ前後に動かす */
function shiftEntryDate(days){
  const next = addDays(parseDate(entryDate), days);
  if (daysBetween(today(), next) > 0) return;   /* 未来には進めない */
  entryDate = dateKey(next);
  syncEntry();
}

function saveEntry(){
  const habit = findHabit(entryHabitId);
  if (habit !== null) {
    habit.records[entryDate] = document.getElementById('entry-memo').value;
    saveState();
  }
  closeEntrySheet();
  renderDetail();
  render();
}

function deleteEntry(){
  const habit = findHabit(entryHabitId);
  if (habit === null) return;

  const memo = habit.records[entryDate];
  if (memo !== undefined && memo !== '') {
    const ok = window.confirm(
      formatDateJa(entryDate) + ' の記録を取り消します。\n' +
      '書いたメモも一緒に消えます。よろしいですか？\n\n' + memo
    );
    if (!ok) return;
  }

  delete habit.records[entryDate];
  saveState();
  closeEntrySheet();
  renderDetail();
  render();
}

function showImportMessage(text, ok){

/* 書き出し … 全データの JSON をテキスト欄に表示する。
   ファイルのダウンロードは使わない。 */
function openSettings(){
  document.getElementById('export-text').value = JSON.stringify(state, null, 2);
  document.getElementById('import-text').value = '';

  showView('settings-view');

/* 読み込み … 貼り付けた JSON で全データを置き換える。
   受け付ける形式は2つ（normalizeState / normalizeRecords が両方を扱う）。
   壊れた JSON は「読み込めませんでした」と出して何も変更しない。 */
function runImport(){
  const raw = document.getElementById('import-text').value;

  /* 先に全部組み立てて、成功したときだけ差し替える。
     途中で失敗しても state には手を付けない。 */
  let next = null;
  try {
    next = normalizeState(JSON.parse(raw));
  } catch (e) {
    showImportMessage('読み込めませんでした', false);
    return;
  }

  if (state.habits.length > 0) {
    const ok = window.confirm(
      'いまのデータを、貼り付けた内容で全部置き換えます。\n' +
      'この操作は元に戻せません。よろしいですか？'
    );
    if (!ok) return;
  }

  state = next;
  saveState();
  render();

  const active = activeHabits().length;
  showImportMessage(
    state.habits.length + '件の習慣を読み込みました（稼働中 ' + active + '件）', true
  );
}

/* =========================================================
   7節 習慣の管理（追加・変更・達成済み・削除）
   ========================================================= */

let habitSheetMode = 'add';   /* 'add' | 'edit' */
let habitSheetId = null;
let habitFormColor = COLORS[0];
let habitStartDate = null;
let habitCalMonth = null;

const HABIT_CAL = { title: 'habit-cal-title', grid: 'habit-cal-grid', next: 'habit-cal-next' };

function nextHabitId(){
  const used = {};
  for (const habit of state.habits) used[habit.id] = true;
  let n = 1;
  while (used['h' + n]) n += 1;
  return 'h' + n;
}

function nextOrder(){
  let max = -1;
  for (const habit of state.habits) {
    if (!habit.archived && habit.order > max) max = habit.order;
  }
  return max + 1;
}

/* 並べ替えの前に、稼働中の order を 0,1,2… に振り直しておく
   （移行データや復帰した習慣で order が重なることがあるため） */
function normalizeOrders(){
  activeHabits().forEach(function(habit, i){ habit.order = i; });
}

function buildColorRow(){
  const row = document.getElementById('habit-colors');
  row.textContent = '';
  for (const color of COLORS) {
    const swatch = document.createElement('button');
    swatch.type = 'button';
    swatch.className = 'color-swatch';
    swatch.dataset.color = color;
    swatch.style.background = color;
    swatch.setAttribute('aria-label', color);
    row.appendChild(swatch);
  }
}

function paintColorRow(){
  for (const swatch of document.querySelectorAll('#habit-colors .color-swatch')) {
    swatch.classList.toggle('is-selected', swatch.dataset.color === habitFormColor);
  }
}

function showHabitError(text){
  const error = document.getElementById('habit-error');
  error.textContent = text;
  error.hidden = false;
}

function closeHabitCalendar(){
  document.getElementById('habit-calendar').hidden = true;
  document.getElementById('habit-start-button').setAttribute('aria-expanded', 'false');
}

function renderHabitCalendar(){
  if (habitCalMonth === null) return;
  /* 変更のときは、その習慣の記録も塗っておく。
     記録より後ろの日を開始日に選んでしまうのが見て分かるように。 */
  const paint = habitSheetMode === 'edit' ? findHabit(habitSheetId) : null;
  renderMonthGrid(HABIT_CAL, habitCalMonth, habitStartDate, paint);
}

function syncHabitSheet(){
  const adding = habitSheetMode === 'add';

  document.getElementById('habit-heading').textContent = adding ? '習慣を追加' : '習慣の設定';
  document.getElementById('habit-save').textContent = adding ? '追加' : '保存';
  document.getElementById('habit-actions').hidden = adding;
  document.getElementById('habit-start-label').textContent =
    habitStartDate === null ? '' : formatDateJa(habitStartDate);

  const save = document.getElementById('habit-save');
  save.style.background = habitFormColor;
  save.style.color = readableOn(habitFormColor);

  paintColorRow();

  if (!adding) {
    const habit = findHabit(habitSheetId);
    if (habit === null) return;

    /* 達成済みにする／稼働中に戻す */
    document.getElementById('habit-archive').textContent =
      habit.archived ? '稼働中に戻す' : '達成済みにする';
  }
}

function openHabitSheet(mode, habitId){
  habitSheetMode = mode;
  habitSheetId = habitId || null;

  const name = document.getElementById('habit-name');
  document.getElementById('habit-error').hidden = true;
  closeHabitCalendar();

  if (mode === 'add') {
    name.value = '';
    habitFormColor = COLORS[0];
    habitStartDate = dateKey(today());   /* 既定は今日 */
  } else {
    const habit = findHabit(habitId);
    if (habit === null) return;
    name.value = habit.name;
    habitFormColor = habit.color;
    habitStartDate = habit.startDate;
  }

  syncHabitSheet();
  document.getElementById('habit-sheet').hidden = false;
}

function closeHabitSheet(){
  habitSheetId = null;
  closeHabitCalendar();
  document.getElementById('habit-sheet').hidden = true;
}

/* 変更が画面に出ている場所すべてを描き直す */
function refreshAfterHabitChange(){
  saveState();
  render();
  if (!document.getElementById('detail-view').hidden) renderDetail();
  if (!document.getElementById('reorder-view').hidden) renderReorder();
  if (!document.getElementById('archived-view').hidden) renderArchived();
}

function saveHabitSheet(){
  const name = document.getElementById('habit-name').value.trim();
  if (name === '') {
    showHabitError('名前を入れてください');
    return;
  }

  if (habitSheetMode === 'add') {
    state.habits.push({
      id: nextHabitId(),
      name: name,
      color: habitFormColor,
      startDate: habitStartDate,
      order: nextOrder(),
      archived: false,
      completedDate: null,
      records: {}
    });
  } else {
    const habit = findHabit(habitSheetId);
    if (habit === null) return;
    habit.name = name;
    habit.color = habitFormColor;
    habit.startDate = habitStartDate;   /* 打ち間違えを直せるように */
  }

  closeHabitSheet();
  refreshAfterHabitChange();
}

/* --- 並び替え専用の一覧 ---
   稼働中の習慣を縦に並べ、その場で上下ボタンで動かす。
   移動のたびにこの画面を描き直すので、ホームへ戻らずに結果が見える。 */

function renderReorder(){
  const list = document.getElementById('reorder-list');
  const habits = activeHabits();

  list.textContent = '';
  habits.forEach(function(habit, at){
    const row = document.createElement('div');
    row.className = 'reorder-row';

    const dot = document.createElement('span');
    dot.className = 'arch-dot';
    dot.style.background = habit.color;
    row.appendChild(dot);

    const name = document.createElement('span');
    name.className = 'reorder-name';
    name.textContent = habit.name;
    row.appendChild(name);

    const up = document.createElement('button');
    up.type = 'button';
    up.className = 'reorder-step';
    up.dataset.moveId = habit.id;
    up.dataset.step = '-1';
    up.setAttribute('aria-label', habit.name + ' を上へ');
    up.textContent = '↑';
    up.disabled = (at === 0);
    row.appendChild(up);

    const down = document.createElement('button');
    down.type = 'button';
    down.className = 'reorder-step';
    down.dataset.moveId = habit.id;
    down.dataset.step = '1';
    down.setAttribute('aria-label', habit.name + ' を下へ');
    down.textContent = '↓';
    down.disabled = (at === habits.length - 1);
    row.appendChild(down);

    list.appendChild(row);
  });

  document.getElementById('reorder-empty').hidden = habits.length > 0;
}

function moveHabit(habitId, step){
  const habit = findHabit(habitId);
  if (habit === null || habit.archived) return;

  normalizeOrders();
  const list = activeHabits();
  const at = list.indexOf(habit);
  const to = at + step;
  if (to < 0 || to >= list.length) return;

  const other = list[to];
  const swap = habit.order;
  habit.order = other.order;
  other.order = swap;

  saveState();
  render();
  renderReorder();
}

function openReorder(){
  renderReorder();
  showView('reorder-view');
}

/* 達成済みにする … ホームから外し、completedDate に最終記録日を入れる。
   記録は消さない。稼働中に戻せる。 */
function toggleArchive(){
  const habit = findHabit(habitSheetId);
  if (habit === null) return;

  if (habit.archived) {
    habit.archived = false;
    habit.completedDate = null;
    habit.order = nextOrder();
    closeHabitSheet();
    refreshAfterHabitChange();
    return;
  }

  habit.archived = true;
  habit.completedDate = lastRecordedDate(habit);
  closeHabitSheet();
  refreshAfterHabitChange();

  /* ホームから外れるので、その習慣の詳細画面には留まらない */
  if (!document.getElementById('detail-view').hidden) showView('home-view');
}

function deleteHabit(){
  const habit = findHabit(habitSheetId);
  if (habit === null) return;

  const ok = window.confirm(
    '「' + habit.name + '」を削除します。\n' +
    totalDays(habit) + '日ぶんの記録も一緒に消えます。\n' +
    'この操作は元に戻せません。よろしいですか？'
  );
  if (!ok) return;

  state.habits = state.habits.filter(function(x){ return x.id !== habit.id; });
  closeHabitSheet();
  refreshAfterHabitChange();
  showView('home-view');
}

/* --- 達成済み一覧 --- */

function renderArchived(){
  const list = document.getElementById('archived-list');
  const archived = state.habits.filter(function(h){ return h.archived; });

  list.textContent = '';
  for (const habit of archived) {
    const row = document.createElement('div');
    row.className = 'arch-row';

    const dot = document.createElement('span');
    dot.className = 'arch-dot';
    dot.style.background = habit.color;
    row.appendChild(dot);

    const body = document.createElement('div');
    body.className = 'arch-body';

    const name = document.createElement('button');
    name.type = 'button';
    name.className = 'arch-name';
    name.dataset.habitId = habit.id;
    name.textContent = habit.name;
    body.appendChild(name);

    const meta = document.createElement('div');
    meta.className = 'arch-meta';
    meta.textContent = totalDays(habit) + '日'
      + (habit.completedDate === null ? '' : '・' + habit.completedDate.replace(/-/g, '/') + ' まで');
    body.appendChild(meta);

    row.appendChild(body);

    const restore = document.createElement('button');
    restore.type = 'button';
    restore.className = 'arch-restore';
    restore.dataset.restoreId = habit.id;
    restore.textContent = '稼働中に戻す';
    row.appendChild(restore);

    list.appendChild(row);
  }

  document.getElementById('archived-empty').hidden = archived.length > 0;
}

function openArchived(){
  renderArchived();
  showView('archived-view');
}

/* --- 配線 --- */

buildColorRow();

document.getElementById('habit-grid').addEventListener('click', function(event){
  if (event.target.closest('.add-card') !== null) openHabitSheet('add');
});

document.getElementById('habit-colors').addEventListener('click', function(event){
  const swatch = event.target.closest('.color-swatch');
  if (swatch === null) return;
  habitFormColor = swatch.dataset.color;
  syncHabitSheet();
});

document.getElementById('habit-start-button').addEventListener('click', function(){
  const calendar = document.getElementById('habit-calendar');
  if (!calendar.hidden) {
    closeHabitCalendar();
    return;
  }
  habitCalMonth = monthStart(parseDate(habitStartDate));
  renderHabitCalendar();
  calendar.hidden = false;
  document.getElementById('habit-start-button').setAttribute('aria-expanded', 'true');
});

document.getElementById('habit-cal-prev').addEventListener('click', function(){
  habitCalMonth = new Date(habitCalMonth.getFullYear(), habitCalMonth.getMonth() - 1, 1);
  renderHabitCalendar();
});

document.getElementById('habit-cal-next').addEventListener('click', function(){
  const next = new Date(habitCalMonth.getFullYear(), habitCalMonth.getMonth() + 1, 1);
  if (next > monthStart(today())) return;
  habitCalMonth = next;
  renderHabitCalendar();
});

document.getElementById('habit-cal-grid').addEventListener('click', function(event){
  const cell = event.target.closest('.cal-day');
  if (cell === null || cell.disabled) return;
  habitStartDate = cell.dataset.date;
  closeHabitCalendar();
  syncHabitSheet();
});

document.getElementById('habit-save').addEventListener('click', saveHabitSheet);
document.getElementById('habit-archive').addEventListener('click', toggleArchive);
document.getElementById('habit-delete').addEventListener('click', deleteHabit);

document.getElementById('habit-sheet').addEventListener('click', function(event){
  if (event.target.closest('[data-habit-cancel]') !== null) closeHabitSheet();
});

document.getElementById('open-reorder').addEventListener('click', openReorder);
document.getElementById('close-reorder').addEventListener('click', function(){
  showView('settings-view');
});

document.getElementById('reorder-list').addEventListener('click', function(event){
  const button = event.target.closest('[data-move-id]');
  if (button === null || button.disabled) return;
  moveHabit(button.dataset.moveId, Number(button.dataset.step));
});

document.getElementById('open-archived').addEventListener('click', openArchived);
document.getElementById('close-archived').addEventListener('click', function(){
  showView('settings-view');
});

document.getElementById('archived-list').addEventListener('click', function(event){
  const restore = event.target.closest('[data-restore-id]');
  if (restore !== null) {
    habitSheetId = restore.dataset.restoreId;
    toggleArchive();
    return;
  }
  const name = event.target.closest('.arch-name');
  if (name !== null) openDetail(name.dataset.habitId);
});

state = loadState();
render();
</script>
</body>
</html>
