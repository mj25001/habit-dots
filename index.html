<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>習慣記録</title>
<style>
:root{
  --bg:#1C1C1E;
  --card:#48484A;
  --dot-empty:#30343A;
  --text:#FFFFFF;
  --sub:#A0A4A8;
}

*{ box-sizing:border-box; }

html{ background:var(--bg); }

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  padding:
    calc(env(safe-area-inset-top) + 14px)
    calc(env(safe-area-inset-right) + 14px)
    calc(env(safe-area-inset-bottom) + 14px)
    calc(env(safe-area-inset-left) + 14px);
}

/* --- ホーム画面：2列のカード --- */
#habit-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:12px 12px 14px;
}

/* 7列 × 5行 = 35マス。左上が今日、右・下へ進むほど過去 */
.dots{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.dot{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  width:100%;
  padding:0;
  border:0;
  aspect-ratio:1 / 1;
  border-radius:3px;
  background:var(--dot-empty);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.dot.is-done{ background:var(--habit-color); }

/* 今日のマスに記録が無いとき … 塗りつぶさず、破線の枠 */
.dot.is-today-open{
  background:transparent;
  border:1.5px dashed var(--habit-color);
}

/* 記録が付いたときだけ、少し膨らんで戻る */
@keyframes dot-pop{
  0%   { transform:scale(1); }
  45%  { transform:scale(1.35); }
  100% { transform:scale(1); }
}

.dot.is-pop{ animation:dot-pop 260ms ease-out; }

.card .count{
  margin-top:10px;
  text-align:center;
  font-size:15px;
  font-weight:700;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}

.card .name{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  width:100%;
  border:0;
  background:transparent;
  padding:0;
  font-family:inherit;
  cursor:pointer;
  margin-top:3px;
  text-align:center;
  font-size:12px;
  line-height:1.3;
  color:var(--sub);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* --- 空の状態 --- */
#empty-state{
  min-height:70vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
}

#empty-state p{
  margin:0;
  color:var(--sub);
  font-size:14px;
}

.add-button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  border-radius:12px;
  padding:12px 22px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

/* --- 6節 詳細画面（履歴） --- */
#detail-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

#detail-name{
  margin:0;
  flex:1;
  min-width:0;
  font-size:17px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

#detail-summary{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}

#detail-status{
  color:var(--sub);
  font-size:13px;
}

#detail-daynumber{
  font-size:15px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* タイムライン */
.tl-row{
  position:relative;
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding-bottom:calc(16px + var(--gap, 0px));
}

/* 記録が無い期間は、線だけが伸びて間隔が空く */
.tl-row::before{
  content:'';
  position:absolute;
  left:13px;
  top:30px;
  bottom:0;
  width:2px;
  background:rgba(255,255,255,0.15);
}

.tl-row.is-last{ padding-bottom:0; }
.tl-row.is-last::before{ display:none; }

.tl-badge{
  flex:0 0 auto;
  width:28px;
  height:28px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

.tl-body{
  flex:1;
  min-width:0;
  padding-top:2px;
}

.tl-line{
  display:flex;
  align-items:baseline;
  gap:12px;
}

.tl-date{
  font-size:14px;
  font-variant-numeric:tabular-nums;
}

.tl-dayno{
  color:var(--sub);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}

.tl-memo{
  margin-top:3px;
  color:var(--sub);
  font-size:13px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.tl-more{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 auto;
  border:0;
  background:transparent;
  color:var(--sub);
  font-size:18px;
  line-height:1;
  padding:4px 6px;
  cursor:pointer;
}

#detail-empty{
  color:var(--sub);
  font-size:13px;
}

#detail-more{ margin-top:4px; }

/* 一覧の下の「＋」 */
#detail-add{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:22px;
  border:1px dashed rgba(255,255,255,0.25);
  border-radius:12px;
  padding:13px;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

/* --- 6節 記録の入力（日付を選んで追加・編集） --- */
.date-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}

.date-step{
  appearance:none;
  -webkit-appearance:none;
  flex:0 0 auto;
  border:0;
  border-radius:10px;
  width:40px;
  height:40px;
  background:var(--bg);
  color:var(--text);
  font-size:18px;
  line-height:1;
  cursor:pointer;
}

.date-step:disabled{ opacity:0.35; cursor:default; }

/* 日付そのものをタップすると端末の日付ピッカーが開く */
.date-display{
  position:relative;
  flex:1;
  text-align:center;
  font-size:15px;
  font-weight:600;
  padding:10px 0;
}

.date-display input[type="date"]{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  border:0;
  padding:0;
  cursor:pointer;
}

#entry-memo{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:inherit;
  font-size:15px;
  line-height:1.5;
  resize:vertical;
}

.danger-button{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:8px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:transparent;
  color:#E5484D;
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

/* --- 5節 過去のマスをタップしたときの案内 --- */
#toast{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 78px);
  z-index:25;
  display:flex;
  justify-content:center;
  padding:0 16px;
  pointer-events:none;
}

#toast span{
  background:var(--card);
  color:var(--text);
  border-radius:999px;
  padding:11px 20px;
  font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,0.45);
  animation:band-in 180ms ease-out;
}

/* --- 8節 設定画面 --- */
#home-head{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}

.icon-button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-size:20px;
  line-height:1;
  padding:6px 4px;
  cursor:pointer;
}

.screen-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.screen-head h1{
  margin:0;
  font-size:17px;
  font-weight:600;
}

.text-button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-family:inherit;
  font-size:15px;
  padding:4px 0;
  cursor:pointer;
}

#settings-view h2{
  margin:0 0 16px;
  font-size:15px;
  font-weight:600;
}

.backup-block{
  margin-bottom:28px;
}

.backup-block h3{
  margin:0 0 4px;
  font-size:14px;
  font-weight:600;
}

.hint{
  margin:0 0 10px;
  color:var(--sub);
  font-size:12px;
  line-height:1.5;
}

#export-text,
#import-text{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  line-height:1.5;
  resize:vertical;
}

.wide-button{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

#import-message{
  margin:12px 0 0;
  font-size:13px;
  line-height:1.5;
}

#import-message.is-ok    { color:#3FC57D; }
#import-message.is-error { color:#E5484D; }

/* --- 5節 「メモを追加」の帯 --- */
#memo-band{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  z-index:20;
  display:flex;
  justify-content:center;
  padding:0 16px;
  pointer-events:none;
}

.band-button{
  appearance:none;
  -webkit-appearance:none;
  pointer-events:auto;
  border:0;
  border-radius:999px;
  padding:13px 26px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.45);
  animation:band-in 180ms ease-out;
}

@keyframes band-in{
  from{ opacity:0; transform:translateY(10px); }
  to  { opacity:1; transform:none; }
}

/* --- 5節 メモ入力欄 --- */
#memo-sheet,
#entry-sheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.sheet-backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

.sheet-panel{
  position:relative;
  background:var(--card);
  border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  animation:sheet-in 200ms ease-out;
}

@keyframes sheet-in{
  from{ transform:translateY(100%); }
  to  { transform:none; }
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.sheet-head h2{
  margin:0;
  font-size:16px;
  font-weight:600;
}

.sheet-close{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-family:inherit;
  font-size:22px;
  line-height:1;
  padding:4px 8px;
  cursor:pointer;
}

#memo-text{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:inherit;
  font-size:15px;
  line-height:1.5;
  resize:vertical;
}

.sheet-done{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--bg);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

/* prefers-reduced-motion を尊重する */
@media (prefers-reduced-motion: reduce){
  .dot.is-pop,
  .band-button,
  .sheet-panel,
  #toast span{
    animation:none;
  }
}

[hidden]{ display:none !important; }
</style>
</head>
<body>

<main>
  <div id="home-view">
    <div id="home-head">
      <button type="button" class="icon-button" id="open-settings" aria-label="設定">⚙</button>
    </div>
    <div id="habit-grid" hidden></div>
    <div id="empty-state" hidden>
      <p>習慣がまだありません</p>
      <button type="button" class="add-button" id="add-habit">習慣を追加</button>
    </div>
  </div>

  <!-- 6節 詳細画面（履歴） -->
  <section id="detail-view" hidden>
    <div id="detail-head">
      <button type="button" class="text-button" id="close-detail">← 戻る</button>
      <h1 id="detail-name"></h1>
      <button type="button" class="icon-button" id="detail-settings" aria-label="習慣の設定">⚙</button>
    </div>

    <div id="detail-summary">
      <span id="detail-status"></span>
      <span id="detail-daynumber"></span>
    </div>

    <div id="detail-list"></div>
    <p id="detail-empty" hidden>まだ記録がありません。</p>
    <button type="button" class="wide-button" id="detail-more" hidden>もっと見る</button>

    <button type="button" id="detail-add">＋</button>
  </section>

  <!-- 8節 設定画面 -->
  <section id="settings-view" hidden>
    <div class="screen-head">
      <button type="button" class="text-button" id="close-settings">← 戻る</button>
      <h1>設定</h1>
    </div>

    <h2>データのバックアップ</h2>

    <section class="backup-block">
      <h3>書き出し</h3>
      <p class="hint">この内容をすべてコピーして保管してください。</p>
      <textarea id="export-text" rows="8" readonly></textarea>
      <button type="button" class="wide-button" id="export-select">すべて選択</button>
    </section>

    <section class="backup-block">
      <h3>読み込み</h3>
      <p class="hint">JSON を貼り付けて「読み込む」を押すと、全データが置き換わります。</p>
      <textarea id="import-text" rows="8" placeholder="ここに JSON を貼り付け"></textarea>
      <button type="button" class="wide-button" id="import-run">読み込む</button>
      <p id="import-message" hidden></p>
    </section>
  </section>
</main>

<!-- 5節 記録が付いた直後に約4秒出る帯 -->
<div id="memo-band" hidden>
  <button type="button" class="band-button" id="memo-band-button">メモを追加</button>
</div>

<!-- 5節 過去のマスをタップしたときの案内 -->
<div id="toast" hidden><span></span></div>

<!-- 6節 記録の入力（「＋」と「⋯」から開く） -->
<div id="entry-sheet" hidden>
  <div class="sheet-backdrop" data-entry-cancel></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="entry-heading">
    <div class="sheet-head">
      <h2 id="entry-heading"></h2>
      <button type="button" class="sheet-close" data-entry-cancel aria-label="閉じる">×</button>
    </div>

    <div class="date-row">
      <button type="button" class="date-step" id="entry-prev" aria-label="前の日">‹</button>
      <div class="date-display">
        <span id="entry-date-label"></span>
        <input type="date" id="entry-date-input" aria-label="日付を選ぶ">
      </div>
      <button type="button" class="date-step" id="entry-next" aria-label="次の日">›</button>
    </div>

    <textarea id="entry-memo" rows="4" placeholder="メモ（任意）"></textarea>
    <button type="button" class="sheet-done" id="entry-save">完了</button>
    <button type="button" class="danger-button" id="entry-delete" hidden>記録を取り消す</button>
  </div>
</div>

<!-- 5節 メモ入力欄 -->
<div id="memo-sheet" hidden>
  <div class="sheet-backdrop" data-memo-cancel></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="memo-title">
    <div class="sheet-head">
      <h2 id="memo-title"></h2>
      <button type="button" class="sheet-close" data-memo-cancel aria-label="閉じる">×</button>
    </div>
    <textarea id="memo-text" rows="5"></textarea>
    <button type="button" class="sheet-done" id="memo-done">完了</button>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   2節 データ
   ========================================================= */

const STORAGE_KEY = 'habit.v1';

/* 7節 DotHabit と同じ7色 */
const COLORS = ['#3FC57D','#5AAFE2','#E5484D','#EC5E9F','#EDC24B','#0596A6','#8B84D7'];

/* 4節 7列 × 5行 = 35マス */
const DOT_COLS  = 7;
const DOT_ROWS  = 5;
const DOT_COUNT = DOT_COLS * DOT_ROWS;

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

/* =========================================================
   日付ヘルパ
   日付は必ずローカル時刻で YYYY-MM-DD を作る。
   toISOString() は UTC になるため使用禁止。
   ========================================================= */

function pad2(n){
  return n < 10 ? '0' + n : String(n);
}

function dateKey(date){
  return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
}

function parseDate(key){
  const y = Number(key.slice(0, 4));
  const m = Number(key.slice(5, 7));
  const d = Number(key.slice(8, 10));
  return new Date(y, m - 1, d);
}

function startOfDay(date){
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function today(){
  return startOfDay(new Date());
}

function addDays(date, n){
  const d = startOfDay(date);
  d.setDate(d.getDate() + n);
  return d;
}

const WEEKDAYS = ['日','月','火','水','木','金','土'];

/* 例: 2026年9月4日（金） */
function formatDateJa(key){
  const d = parseDate(key);
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'
    + '（' + WEEKDAYS[d.getDay()] + '）';
}

/* b - a を日数で返す */
function daysBetween(a, b){
  const ms = startOfDay(b).getTime() - startOfDay(a).getTime();
  return Math.round(ms / 86400000);
}

/* =========================================================
   3節 計算ルール
   すべて日付の文字列比較ではなく、日付オブジェクトで計算する
   ========================================================= */

function hasRecord(habit, key){
  return Object.prototype.hasOwnProperty.call(habit.records, key);
}

/* 累計完了日数 … records の件数 */
function totalDays(habit){
  return Object.keys(habit.records).length;
}

/* 通算日数（◯日目） … (今日 - startDate).days + 1。開始日が1日目 */
function dayNumber(habit, ref){
  return daysBetween(parseDate(habit.startDate), ref || today()) + 1;
}

/* 連続日数 … その日で終わる連続記録の長さ。前日に記録が無ければ 1 */
function streakEndingOn(habit, date){
  let n = 0;
  let d = startOfDay(date);
  while (hasRecord(habit, dateKey(d))) {
    n += 1;
    d = addDays(d, -1);
  }
  return n;
}

/* 現在の連続日数 … 今日に記録があれば今日から遡って数える。
   無ければ前日から遡る（朝に 0 と出さないため） */
function currentStreak(habit, ref){
  const base = ref || today();
  if (hasRecord(habit, dateKey(base))) return streakEndingOn(habit, base);
  return streakEndingOn(habit, addDays(base, -1));
}

/* 記録のある最終日 */
function lastRecordedDate(habit){
  const keys = Object.keys(habit.records);
  if (keys.length === 0) return null;
  let max = keys[0];
  for (const key of keys) {
    if (parseDate(key) > parseDate(max)) max = key;
  }
  return max;
}

/* =========================================================
   取り込みデータの正規化
   8節 … 2つの形式を受け付ける
     1. アプリ自身が書き出した形式（records が日付をキーにしたオブジェクト）
     2. 移行データの形式（records が日付文字列の配列。メモは無い）
   このアプリに無い項目が入っていても無視する。
   ========================================================= */

function normalizeRecords(records){
  const out = {};
  if (Array.isArray(records)) {
    for (const key of records) {
      if (typeof key === 'string' && DATE_RE.test(key)) out[key] = '';
    }
    return out;
  }
  if (records && typeof records === 'object') {
    for (const key of Object.keys(records)) {
      if (!DATE_RE.test(key)) continue;
      const memo = records[key];
      out[key] = typeof memo === 'string' ? memo : '';
    }
    return out;
  }
  return out;
}

function normalizeHabit(raw, index){
  const source = raw && typeof raw === 'object' ? raw : {};
  const archived = source.archived === true;

  const habit = {
    id: typeof source.id === 'string' && source.id ? source.id : 'h' + (index + 1),
    name: typeof source.name === 'string' ? source.name : '',
    color: typeof source.color === 'string' && /^#[0-9A-Fa-f]{6}$/.test(source.color)
      ? source.color
      : COLORS[0],
    startDate: typeof source.startDate === 'string' && DATE_RE.test(source.startDate)
      ? source.startDate
      : dateKey(today()),
    order: typeof source.order === 'number' && isFinite(source.order) ? source.order : index,
    archived: archived,
    completedDate: null,
    records: normalizeRecords(source.records)
  };

  /* 達成日 … 達成済みにした時点で、記録のある最終日 */
  if (archived) {
    habit.completedDate =
      typeof source.completedDate === 'string' && DATE_RE.test(source.completedDate)
        ? source.completedDate
        : lastRecordedDate(habit);
  }

  return habit;
}

function normalizeState(data){
  if (!data || typeof data !== 'object' || !Array.isArray(data.habits)) {
    throw new Error('habits が見つかりません');
  }
  return {
    version: 1,
    habits: data.habits.map(normalizeHabit)
  };
}

function emptyState(){
  return { version: 1, habits: [] };
}

/* =========================================================
   保存先 localStorage、キーは habit.v1
   読み書きは必ず try/catch で囲む
   （プライベートブラウズ等で例外が出る）
   ========================================================= */

function loadState(){
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    console.warn('localStorage を読めませんでした', e);
    return emptyState();
  }
  if (!raw) return emptyState();
  try {
    return normalizeState(JSON.parse(raw));
  } catch (e) {
    console.warn('保存データを読めませんでした', e);
    return emptyState();
  }
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('localStorage に保存できませんでした', e);
  }
}

/* =========================================================
   4節 ホーム画面
   ========================================================= */

let state = emptyState();

/* 稼働中の習慣（archived: false）だけを order 順に */
function activeHabits(){
  return state.habits
    .filter(function(habit){ return !habit.archived; })
    .sort(function(a, b){ return a.order - b.order; });
}

/* マスの並び（重要）
   これはカレンダーではない。曜日は揃えない。
   左上が今日。右へ進むごとに1日ずつ過去へ、行末まで行ったら次の行の左端へ続く。
   i 番目のマス（0始まり、左上から右下へ）は 今日 - i 日。右下が34日前。 */
function buildDots(habit, base){
  const dots = document.createElement('div');
  dots.className = 'dots';

  for (let i = 0; i < DOT_COUNT; i++) {
    const key = dateKey(addDays(base, -i));

    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'dot';
    dot.dataset.date = key;
    dot.setAttribute('aria-label', formatDateJa(key));

    if (hasRecord(habit, key)) {
      dot.classList.add('is-done');
    } else if (i === 0) {
      /* 今日のマスに記録が無いとき … 塗りつぶさず、color の破線の枠 */
      dot.classList.add('is-today-open');
    }

    dots.appendChild(dot);
  }

  return dots;
}

function buildCard(habit, base){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.habitId = habit.id;
  card.style.setProperty('--habit-color', habit.color);

  card.appendChild(buildDots(habit, base));

  const count = document.createElement('div');
  count.className = 'count';
  count.textContent = '🔥 ' + totalDays(habit);
  card.appendChild(count);

  /* 習慣名をタップすると詳細画面（6節） */
  const name = document.createElement('button');
  name.type = 'button';
  name.className = 'name';
  name.dataset.habitId = habit.id;
  name.textContent = habit.name;
  card.appendChild(name);

  return card;
}

function render(){
  const grid = document.getElementById('habit-grid');
  const empty = document.getElementById('empty-state');
  const habits = activeHabits();
  const base = today();

  grid.textContent = '';
  for (const habit of habits) grid.appendChild(buildCard(habit, base));

  grid.hidden = habits.length === 0;
  empty.hidden = habits.length > 0;
}

/* カード1枚だけを描き直す。
   ホーム画面に留まったまま更新するので、画面遷移は起こらない。 */
function refreshCard(card, habit){
  const base = today();
  const dots = card.querySelectorAll('.dot');

  for (let i = 0; i < dots.length; i++) {
    const key = dateKey(addDays(base, -i));
    const done = hasRecord(habit, key);
    dots[i].classList.toggle('is-done', done);
    dots[i].classList.toggle('is-today-open', !done && i === 0);
  }

  card.querySelector('.count').textContent = '🔥 ' + totalDays(habit);
}

function findHabit(id){
  for (const habit of state.habits) {
    if (habit.id === id) return habit;
  }
  return null;
}

/* =========================================================
   5節 「メモを追加」の帯
   記録が付いた直後に約4秒出る。押さなければ静かに消える。
   ========================================================= */

const BAND_MS = 4000;

let bandTarget = null;   /* { habitId, key } */
let bandTimer = null;

function showBand(habitId, key){
  /* 帯が出ている間に別のマスをタップしたら、対象を新しい記録に差し替える */
  bandTarget = { habitId: habitId, key: key };

  if (bandTimer !== null) clearTimeout(bandTimer);
  document.getElementById('memo-band').hidden = false;
  bandTimer = setTimeout(hideBand, BAND_MS);
}

function hideBand(){
  if (bandTimer !== null) {
    clearTimeout(bandTimer);
    bandTimer = null;
  }
  bandTarget = null;
  document.getElementById('memo-band').hidden = true;
}

/* =========================================================
   5節 メモ入力欄
   日付の見出し、複数行のテキスト欄、「完了」ボタン
   ========================================================= */

let memoTarget = null;     /* { habitId, key } */
let memoOpenedWith = '';   /* 開いたときのテキスト欄の内容 */

function openMemo(){
  if (bandTarget === null) return;

  const target = bandTarget;
  const habit = findHabit(target.habitId);

  hideBand();

  /* 帯を押すまでの間に記録が外されていたら開かない */
  if (habit === null || !hasRecord(habit, target.key)) return;

  memoTarget = target;
  document.getElementById('memo-title').textContent = formatDateJa(target.key);

  const text = document.getElementById('memo-text');
  text.value = habit.records[target.key];
  memoOpenedWith = text.value;

  document.getElementById('memo-sheet').hidden = false;
  text.focus();
}

function closeMemoSheet(){
  memoTarget = null;
  memoOpenedWith = '';
  document.getElementById('memo-sheet').hidden = true;
}

/* 「完了」以外で閉じるとき。
   開いたときの内容から変更されている場合だけ確認を出す。
   保存済みメモを開いて何も変えずに閉じるときは確認しない。 */
function cancelMemo(){
  if (memoTarget !== null && document.getElementById('memo-text').value !== memoOpenedWith) {
    const ok = window.confirm('書きかけのメモは保存されません。よろしいですか？');
    if (!ok) return;
  }
  closeMemoSheet();
}

/* 「完了」… メモを記録に書き込む */
function saveMemo(){
  if (memoTarget !== null) {
    const habit = findHabit(memoTarget.habitId);
    if (habit !== null && hasRecord(habit, memoTarget.key)) {
      habit.records[memoTarget.key] = document.getElementById('memo-text').value;
      saveState();
    }
  }
  closeMemoSheet();
}

/* =========================================================
   5節 マスのタップ
   その場で記録が付く／外れる。画面遷移は起こさない。
   ========================================================= */

function popDot(dot){
  dot.classList.remove('is-pop');
  void dot.offsetWidth;   /* アニメーションを再生し直すための reflow */
  dot.classList.add('is-pop');
}

function toggleRecord(habit, key, dot, card){
  if (hasRecord(habit, key)) {
    /* すでに記録がある日 … 記録が外れる（トグル）
       メモが入っている場合は、メモも消える旨を確認してから消す */
    const memo = habit.records[key];
    if (memo !== '') {
      const ok = window.confirm(
        formatDateJa(key) + ' の記録を外します。\n' +
        '書いたメモも一緒に消えます。よろしいですか？\n\n' + memo
      );
      if (!ok) return;
    }

    delete habit.records[key];
    saveState();
    refreshCard(card, habit);

    /* 記録を外したときは帯を出さない。
       いま出ている帯がこの記録を指していたら引っ込める */
    if (bandTarget !== null && bandTarget.habitId === habit.id && bandTarget.key === key) {
      hideBand();
    }
    return;
  }

  /* メモ無しは空文字 */
  habit.records[key] = '';
  saveState();
  refreshCard(card, habit);
  popDot(dot);
  showBand(habit.id, key);
}

document.getElementById('habit-grid').addEventListener('click', function(event){
  /* 習慣名 → 詳細画面（6節） */
  const nameButton = event.target.closest('.name');
  if (nameButton !== null) {
    openDetail(nameButton.dataset.habitId);
    return;
  }

  const dot = event.target.closest('.dot');
  if (dot === null) return;

  const card = dot.closest('.card');
  const habit = findHabit(card.dataset.habitId);
  if (habit === null) return;

  /* タップできるのは今日のマスだけ。
     過去のマスはデータを一切変更せず、案内だけ出す。 */
  if (dot.dataset.date !== dateKey(today())) {
    showToast('過去の記録は履歴から追加できます');
    return;
  }

  toggleRecord(habit, dot.dataset.date, dot, card);
});

document.getElementById('memo-band-button').addEventListener('click', openMemo);
document.getElementById('memo-done').addEventListener('click', saveMemo);

document.getElementById('memo-sheet').addEventListener('click', function(event){
  if (event.target.closest('[data-memo-cancel]') !== null) cancelMemo();
});

document.addEventListener('keydown', function(event){
  if (event.key !== 'Escape') return;
  if (!document.getElementById('memo-sheet').hidden) cancelMemo();
  else if (!document.getElementById('entry-sheet').hidden) cancelEntry();
});

/* =========================================================
   画面の切り替え
   ========================================================= */

const VIEWS = ['home-view', 'detail-view', 'settings-view'];

function showView(id){
  hideBand();
  for (const view of VIEWS) {
    document.getElementById(view).hidden = (view !== id);
  }
  window.scrollTo(0, 0);
}

/* 5節 過去のマスをタップしたときの案内（2秒ほど） */
const TOAST_MS = 2000;
let toastTimer = null;

function showToast(text){
  const toast = document.getElementById('toast');
  toast.querySelector('span').textContent = text;
  toast.hidden = false;

  if (toastTimer !== null) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toast.hidden = true;
    toastTimer = null;
  }, TOAST_MS);
}

/* =========================================================
   6節 詳細画面（履歴）
   ========================================================= */

const DETAIL_PAGE = 100;

let detailHabitId = null;
let detailLimit = DETAIL_PAGE;

/* バッジの数字が読める文字色を選ぶ（7色とも使うため） */
function readableOn(color){
  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const b = parseInt(color.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#1C1C1E' : '#FFFFFF';
}

/* 新しい順。文字列比較ではなく日付オブジェクトで並べる */
function recordKeysNewestFirst(habit){
  return Object.keys(habit.records).sort(function(a, b){
    return parseDate(b).getTime() - parseDate(a).getTime();
  });
}

function buildTimelineRow(habit, key, olderKey, isLast){
  const date = parseDate(key);

  const row = document.createElement('div');
  row.className = 'tl-row';
  if (isLast) row.classList.add('is-last');

  /* 記録が無い期間は、線だけが伸びて間隔が空く */
  if (olderKey !== undefined) {
    const gap = daysBetween(parseDate(olderKey), date) - 1;
    if (gap > 0) row.style.setProperty('--gap', Math.min(gap, 14) * 3 + 'px');
  }

  /* 左のバッジ＝その日が連続何日目か */
  const badge = document.createElement('div');
  badge.className = 'tl-badge';
  badge.style.background = habit.color;
  badge.style.color = readableOn(habit.color);
  badge.textContent = streakEndingOn(habit, date);
  row.appendChild(badge);

  const body = document.createElement('div');
  body.className = 'tl-body';

  const line = document.createElement('div');
  line.className = 'tl-line';

  const dateText = document.createElement('span');
  dateText.className = 'tl-date';
  dateText.textContent = key.replace(/-/g, '/');
  line.appendChild(dateText);

  const dayNo = document.createElement('span');
  dayNo.className = 'tl-dayno';
  dayNo.textContent = dayNumber(habit, date) + '日目';
  line.appendChild(dayNo);

  body.appendChild(line);

  const memo = habit.records[key];
  if (memo !== '') {
    const memoText = document.createElement('div');
    memoText.className = 'tl-memo';
    memoText.textContent = memo;
    body.appendChild(memoText);
  }

  row.appendChild(body);

  /* 右端の「⋯」から、その記録の編集・削除 */
  const more = document.createElement('button');
  more.type = 'button';
  more.className = 'tl-more';
  more.dataset.date = key;
  more.setAttribute('aria-label', formatDateJa(key) + ' の記録を編集');
  more.textContent = '⋯';
  row.appendChild(more);

  return row;
}

function renderDetail(){
  const habit = findHabit(detailHabitId);
  if (habit === null) {
    showView('home-view');
    return;
  }

  const base = today();
  const todayKey = dateKey(base);

  document.getElementById('detail-name').textContent = habit.name;
  document.getElementById('detail-daynumber').textContent = dayNumber(habit, base) + '日目';

  /* 今日まだ記録が無ければ「今日も完了させましょう！」、
     記録済みなら「◯日連続達成中」 */
  document.getElementById('detail-status').textContent =
    hasRecord(habit, todayKey)
      ? currentStreak(habit, base) + '日連続達成中'
      : '今日も完了させましょう！';

  const keys = recordKeysNewestFirst(habit);
  const shown = keys.slice(0, detailLimit);

  const list = document.getElementById('detail-list');
  list.textContent = '';
  shown.forEach(function(key, i){
    list.appendChild(buildTimelineRow(habit, key, shown[i + 1], i === shown.length - 1));
  });

  document.getElementById('detail-empty').hidden = keys.length > 0;
  document.getElementById('detail-more').hidden = keys.length <= shown.length;
}

function openDetail(habitId){
  detailHabitId = habitId;
  detailLimit = DETAIL_PAGE;
  renderDetail();
  showView('detail-view');
}

/* =========================================================
   6節 記録の入力（過去の日はここから）
   ========================================================= */

let entryHabitId = null;
let entryDate = null;
let entryOpenedWith = '';

function syncEntry(){
  const habit = findHabit(entryHabitId);
  if (habit === null) return;

  const todayKey = dateKey(today());
  const exists = hasRecord(habit, entryDate);

  document.getElementById('entry-date-label').textContent = formatDateJa(entryDate);

  const input = document.getElementById('entry-date-input');
  input.max = todayKey;          /* 未来には進めない */
  input.value = entryDate;

  document.getElementById('entry-next').disabled = (entryDate === todayKey);

  /* すでに記録がある日は、その日のメモを読み込んでボタンを「保存」に変える */
  const memo = document.getElementById('entry-memo');
  memo.value = exists ? habit.records[entryDate] : '';
  entryOpenedWith = memo.value;

  document.getElementById('entry-heading').textContent = exists ? '記録を編集' : '記録を追加';
  document.getElementById('entry-save').textContent = exists ? '保存' : '完了';
  document.getElementById('entry-delete').hidden = !exists;
}

function openEntry(habitId, key){
  entryHabitId = habitId;
  entryDate = key;
  syncEntry();
  document.getElementById('entry-sheet').hidden = false;
}

function closeEntrySheet(){
  entryHabitId = null;
  entryDate = null;
  entryOpenedWith = '';
  document.getElementById('entry-sheet').hidden = true;
}

function cancelEntry(){
  if (entryDate !== null && document.getElementById('entry-memo').value !== entryOpenedWith) {
    const ok = window.confirm('書きかけのメモは保存されません。よろしいですか？');
    if (!ok) return;
  }
  closeEntrySheet();
}

/* 矢印で1日ずつ前後に動かす */
function shiftEntryDate(days){
  const next = addDays(parseDate(entryDate), days);
  if (daysBetween(today(), next) > 0) return;   /* 未来には進めない */
  entryDate = dateKey(next);
  syncEntry();
}

function saveEntry(){
  const habit = findHabit(entryHabitId);
  if (habit !== null) {
    habit.records[entryDate] = document.getElementById('entry-memo').value;
    saveState();
  }
  closeEntrySheet();
  renderDetail();
  render();
}

function deleteEntry(){
  const habit = findHabit(entryHabitId);
  if (habit === null) return;

  const memo = habit.records[entryDate];
  if (memo !== undefined && memo !== '') {
    const ok = window.confirm(
      formatDateJa(entryDate) + ' の記録を取り消します。\n' +
      '書いたメモも一緒に消えます。よろしいですか？\n\n' + memo
    );
    if (!ok) return;
  }

  delete habit.records[entryDate];
  saveState();
  closeEntrySheet();
  renderDetail();
  render();
}

document.getElementById('close-detail').addEventListener('click', function(){
  showView('home-view');
});

document.getElementById('detail-more').addEventListener('click', function(){
  detailLimit += DETAIL_PAGE;
  renderDetail();
});

document.getElementById('detail-add').addEventListener('click', function(){
  openEntry(detailHabitId, dateKey(today()));
});

document.getElementById('detail-list').addEventListener('click', function(event){
  const more = event.target.closest('.tl-more');
  if (more === null) return;
  openEntry(detailHabitId, more.dataset.date);
});

/* 習慣ごとの設定は 7節。実装の順番では 6 番目 */
document.getElementById('detail-settings').addEventListener('click', function(){
  window.alert('習慣の設定はこれから実装します');
});

document.getElementById('entry-prev').addEventListener('click', function(){ shiftEntryDate(-1); });
document.getElementById('entry-next').addEventListener('click', function(){ shiftEntryDate(1); });
document.getElementById('entry-save').addEventListener('click', saveEntry);
document.getElementById('entry-delete').addEventListener('click', deleteEntry);

/* 日付そのものをタップしたときの端末の日付ピッカー */
document.getElementById('entry-date-input').addEventListener('change', function(event){
  const picked = event.target.value;
  if (!DATE_RE.test(picked)) return;
  if (daysBetween(today(), parseDate(picked)) > 0) return;
  entryDate = picked;
  syncEntry();
});

document.getElementById('entry-sheet').addEventListener('click', function(event){
  if (event.target.closest('[data-entry-cancel]') !== null) cancelEntry();
});

/* =========================================================
   8節 データのバックアップ
   ========================================================= */

function showImportMessage(text, ok){
  const message = document.getElementById('import-message');
  message.textContent = text;
  message.classList.toggle('is-ok', ok);
  message.classList.toggle('is-error', !ok);
  message.hidden = false;
}

/* 書き出し … 全データの JSON をテキスト欄に表示する。
   ファイルのダウンロードは使わない。 */
function openSettings(){
  document.getElementById('export-text').value = JSON.stringify(state, null, 2);
  document.getElementById('import-text').value = '';
  document.getElementById('import-message').hidden = true;
  showView('settings-view');
}

function closeSettings(){
  showView('home-view');
}

/* 読み込み … 貼り付けた JSON で全データを置き換える。
   受け付ける形式は2つ（normalizeState / normalizeRecords が両方を扱う）。
   壊れた JSON は「読み込めませんでした」と出して何も変更しない。 */
function runImport(){
  const raw = document.getElementById('import-text').value;

  /* 先に全部組み立てて、成功したときだけ差し替える。
     途中で失敗しても state には手を付けない。 */
  let next = null;
  try {
    next = normalizeState(JSON.parse(raw));
  } catch (e) {
    showImportMessage('読み込めませんでした', false);
    return;
  }

  if (state.habits.length > 0) {
    const ok = window.confirm(
      'いまのデータを、貼り付けた内容で全部置き換えます。\n' +
      'この操作は元に戻せません。よろしいですか？'
    );
    if (!ok) return;
  }

  state = next;
  saveState();
  render();

  const active = activeHabits().length;
  showImportMessage(
    state.habits.length + '件の習慣を読み込みました（稼働中 ' + active + '件）', true
  );
}

document.getElementById('open-settings').addEventListener('click', openSettings);
document.getElementById('close-settings').addEventListener('click', closeSettings);
document.getElementById('import-run').addEventListener('click', runImport);

document.getElementById('export-select').addEventListener('click', function(){
  const text = document.getElementById('export-text');
  text.focus();
  text.select();
});

/* 習慣の追加は 7節。実装の順番では 4 番目 */
document.getElementById('add-habit').addEventListener('click', function(){
  window.alert('習慣の追加はこれから実装します');
});

state = loadState();
render();
</script>
