<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>習慣記録</title>
<style>
:root{
  --bg:#1C1C1E;
  --card:#48484A;
  --dot-empty:#30343A;
  --text:#FFFFFF;
  --sub:#A0A4A8;
}

*{ box-sizing:border-box; }

html{ background:var(--bg); }

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  padding:
    calc(env(safe-area-inset-top) + 14px)
    calc(env(safe-area-inset-right) + 14px)
    calc(env(safe-area-inset-bottom) + 14px)
    calc(env(safe-area-inset-left) + 14px);
}

/* --- ホーム画面：2列のカード --- */
#habit-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:12px 12px 14px;
}

/* 7列 × 5行 = 35マス。左上が今日、右・下へ進むほど過去 */
.dots{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.dot{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  width:100%;
  padding:0;
  border:0;
  aspect-ratio:1 / 1;
  border-radius:3px;
  background:var(--dot-empty);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.dot.is-done{ background:var(--habit-color); }

/* 今日のマスに記録が無いとき … 塗りつぶさず、破線の枠 */
.dot.is-today-open{
  background:transparent;
  border:1.5px dashed var(--habit-color);
}

/* 記録が付いたときだけ、少し膨らんで戻る */
@keyframes dot-pop{
  0%   { transform:scale(1); }
  45%  { transform:scale(1.35); }
  100% { transform:scale(1); }
}

.dot.is-pop{ animation:dot-pop 260ms ease-out; }

.card .count{
  margin-top:10px;
  text-align:center;
  font-size:15px;
  font-weight:700;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}

.card .name{
  margin-top:3px;
  text-align:center;
  font-size:12px;
  line-height:1.3;
  color:var(--sub);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* --- 空の状態 --- */
#empty-state{
  min-height:70vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
}

#empty-state p{
  margin:0;
  color:var(--sub);
  font-size:14px;
}

.add-button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  border-radius:12px;
  padding:12px 22px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

/* --- 8節 設定画面 --- */
#home-head{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}

.icon-button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-size:20px;
  line-height:1;
  padding:6px 4px;
  cursor:pointer;
}

.screen-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.screen-head h1{
  margin:0;
  font-size:17px;
  font-weight:600;
}

.text-button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-family:inherit;
  font-size:15px;
  padding:4px 0;
  cursor:pointer;
}

#settings-view h2{
  margin:0 0 16px;
  font-size:15px;
  font-weight:600;
}

.backup-block{
  margin-bottom:28px;
}

.backup-block h3{
  margin:0 0 4px;
  font-size:14px;
  font-weight:600;
}

.hint{
  margin:0 0 10px;
  color:var(--sub);
  font-size:12px;
  line-height:1.5;
}

#export-text,
#import-text{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  line-height:1.5;
  resize:vertical;
}

.wide-button{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

#import-message{
  margin:12px 0 0;
  font-size:13px;
  line-height:1.5;
}

#import-message.is-ok    { color:#3FC57D; }
#import-message.is-error { color:#E5484D; }

/* --- 5節 「メモを追加」の帯 --- */
#memo-band{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  z-index:20;
  display:flex;
  justify-content:center;
  padding:0 16px;
  pointer-events:none;
}

.band-button{
  appearance:none;
  -webkit-appearance:none;
  pointer-events:auto;
  border:0;
  border-radius:999px;
  padding:13px 26px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.45);
  animation:band-in 180ms ease-out;
}

@keyframes band-in{
  from{ opacity:0; transform:translateY(10px); }
  to  { opacity:1; transform:none; }
}

/* --- 5節 メモ入力欄 --- */
#memo-sheet{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.sheet-backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

.sheet-panel{
  position:relative;
  background:var(--card);
  border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  animation:sheet-in 200ms ease-out;
}

@keyframes sheet-in{
  from{ transform:translateY(100%); }
  to  { transform:none; }
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.sheet-head h2{
  margin:0;
  font-size:16px;
  font-weight:600;
}

.sheet-close{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:var(--sub);
  font-family:inherit;
  font-size:22px;
  line-height:1;
  padding:4px 8px;
  cursor:pointer;
}

#memo-text{
  display:block;
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  padding:12px;
  font-family:inherit;
  font-size:15px;
  line-height:1.5;
  resize:vertical;
}

.sheet-done{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--bg);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

/* prefers-reduced-motion を尊重する */
@media (prefers-reduced-motion: reduce){
  .dot.is-pop,
  .band-button,
  .sheet-panel{
    animation:none;
  }
}

[hidden]{ display:none !important; }
</style>
</head>
<body>

<main>
  <div id="home-view">
    <div id="home-head">
      <button type="button" class="icon-button" id="open-settings" aria-label="設定">⚙</button>
    </div>
    <div id="habit-grid" hidden></div>
    <div id="empty-state" hidden>
      <p>習慣がまだありません</p>
      <button type="button" class="add-button" id="add-habit">習慣を追加</button>
    </div>
  </div>

  <!-- 8節 設定画面 -->
  <section id="settings-view" hidden>
    <div class="screen-head">
      <button type="button" class="text-button" id="close-settings">← 戻る</button>
      <h1>設定</h1>
    </div>

    <h2>データのバックアップ</h2>

    <section class="backup-block">
      <h3>書き出し</h3>
      <p class="hint">この内容をすべてコピーして保管してください。</p>
      <textarea id="export-text" rows="8" readonly></textarea>
      <button type="button" class="wide-button" id="export-select">すべて選択</button>
    </section>

    <section class="backup-block">
      <h3>読み込み</h3>
      <p class="hint">JSON を貼り付けて「読み込む」を押すと、全データが置き換わります。</p>
      <textarea id="import-text" rows="8" placeholder="ここに JSON を貼り付け"></textarea>
      <button type="button" class="wide-button" id="import-run">読み込む</button>
      <p id="import-message" hidden></p>
    </section>
  </section>
</main>

<!-- 5節 記録が付いた直後に約4秒出る帯 -->
<div id="memo-band" hidden>
  <button type="button" class="band-button" id="memo-band-button">メモを追加</button>
</div>

<!-- 5節 メモ入力欄 -->
<div id="memo-sheet" hidden>
  <div class="sheet-backdrop" data-memo-cancel></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="memo-title">
    <div class="sheet-head">
      <h2 id="memo-title"></h2>
      <button type="button" class="sheet-close" data-memo-cancel aria-label="閉じる">×</button>
    </div>
    <textarea id="memo-text" rows="5"></textarea>
    <button type="button" class="sheet-done" id="memo-done">完了</button>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   2節 データ
   ========================================================= */

const STORAGE_KEY = 'habit.v1';

/* 7節 DotHabit と同じ7色 */
const COLORS = ['#3FC57D','#5AAFE2','#E5484D','#EC5E9F','#EDC24B','#0596A6','#8B84D7'];

/* 4節 7列 × 5行 = 35マス */
const DOT_COLS  = 7;
const DOT_ROWS  = 5;
const DOT_COUNT = DOT_COLS * DOT_ROWS;

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

/* =========================================================
   日付ヘルパ
   日付は必ずローカル時刻で YYYY-MM-DD を作る。
   toISOString() は UTC になるため使用禁止。
   ========================================================= */

function pad2(n){
  return n < 10 ? '0' + n : String(n);
}

function dateKey(date){
  return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
}

function parseDate(key){
  const y = Number(key.slice(0, 4));
  const m = Number(key.slice(5, 7));
  const d = Number(key.slice(8, 10));
  return new Date(y, m - 1, d);
}

function startOfDay(date){
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function today(){
  return startOfDay(new Date());
}

function addDays(date, n){
  const d = startOfDay(date);
  d.setDate(d.getDate() + n);
  return d;
}

const WEEKDAYS = ['日','月','火','水','木','金','土'];

/* 例: 2026年9月4日（金） */
function formatDateJa(key){
  const d = parseDate(key);
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'
    + '（' + WEEKDAYS[d.getDay()] + '）';
}

/* b - a を日数で返す */
function daysBetween(a, b){
  const ms = startOfDay(b).getTime() - startOfDay(a).getTime();
  return Math.round(ms / 86400000);
}

/* =========================================================
   3節 計算ルール
   すべて日付の文字列比較ではなく、日付オブジェクトで計算する
   ========================================================= */

function hasRecord(habit, key){
  return Object.prototype.hasOwnProperty.call(habit.records, key);
}

/* 累計完了日数 … records の件数 */
function totalDays(habit){
  return Object.keys(habit.records).length;
}

/* 通算日数（◯日目） … (今日 - startDate).days + 1。開始日が1日目 */
function dayNumber(habit, ref){
  return daysBetween(parseDate(habit.startDate), ref || today()) + 1;
}

/* 連続日数 … その日で終わる連続記録の長さ。前日に記録が無ければ 1 */
function streakEndingOn(habit, date){
  let n = 0;
  let d = startOfDay(date);
  while (hasRecord(habit, dateKey(d))) {
    n += 1;
    d = addDays(d, -1);
  }
  return n;
}

/* 現在の連続日数 … 今日に記録があれば今日から遡って数える。
   無ければ前日から遡る（朝に 0 と出さないため） */
function currentStreak(habit, ref){
  const base = ref || today();
  if (hasRecord(habit, dateKey(base))) return streakEndingOn(habit, base);
  return streakEndingOn(habit, addDays(base, -1));
}

/* 記録のある最終日 */
function lastRecordedDate(habit){
  const keys = Object.keys(habit.records);
  if (keys.length === 0) return null;
  let max = keys[0];
  for (const key of keys) {
    if (parseDate(key) > parseDate(max)) max = key;
  }
  return max;
}

/* =========================================================
   取り込みデータの正規化
   8節 … 2つの形式を受け付ける
     1. アプリ自身が書き出した形式（records が日付をキーにしたオブジェクト）
     2. 移行データの形式（records が日付文字列の配列。メモは無い）
   このアプリに無い項目が入っていても無視する。
   ========================================================= */

function normalizeRecords(records){
  const out = {};
  if (Array.isArray(records)) {
    for (const key of records) {
      if (typeof key === 'string' && DATE_RE.test(key)) out[key] = '';
    }
    return out;
  }
  if (records && typeof records === 'object') {
    for (const key of Object.keys(records)) {
      if (!DATE_RE.test(key)) continue;
      const memo = records[key];
      out[key] = typeof memo === 'string' ? memo : '';
    }
    return out;
  }
  return out;
}

function normalizeHabit(raw, index){
  const source = raw && typeof raw === 'object' ? raw : {};
  const archived = source.archived === true;

  const habit = {
    id: typeof source.id === 'string' && source.id ? source.id : 'h' + (index + 1),
    name: typeof source.name === 'string' ? source.name : '',
    color: typeof source.color === 'string' && /^#[0-9A-Fa-f]{6}$/.test(source.color)
      ? source.color
      : COLORS[0],
    startDate: typeof source.startDate === 'string' && DATE_RE.test(source.startDate)
      ? source.startDate
      : dateKey(today()),
    order: typeof source.order === 'number' && isFinite(source.order) ? source.order : index,
    archived: archived,
    completedDate: null,
    records: normalizeRecords(source.records)
  };

  /* 達成日 … 達成済みにした時点で、記録のある最終日 */
  if (archived) {
    habit.completedDate =
      typeof source.completedDate === 'string' && DATE_RE.test(source.completedDate)
        ? source.completedDate
        : lastRecordedDate(habit);
  }

  return habit;
}

function normalizeState(data){
  if (!data || typeof data !== 'object' || !Array.isArray(data.habits)) {
    throw new Error('habits が見つかりません');
  }
  return {
    version: 1,
    habits: data.habits.map(normalizeHabit)
  };
}

function emptyState(){
  return { version: 1, habits: [] };
}

/* =========================================================
   保存先 localStorage、キーは habit.v1
   読み書きは必ず try/catch で囲む
   （プライベートブラウズ等で例外が出る）
   ========================================================= */

function loadState(){
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    console.warn('localStorage を読めませんでした', e);
    return emptyState();
  }
  if (!raw) return emptyState();
  try {
    return normalizeState(JSON.parse(raw));
  } catch (e) {
    console.warn('保存データを読めませんでした', e);
    return emptyState();
  }
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('localStorage に保存できませんでした', e);
  }
}

/* =========================================================
   4節 ホーム画面
   ========================================================= */

let state = emptyState();

/* 稼働中の習慣（archived: false）だけを order 順に */
function activeHabits(){
  return state.habits
    .filter(function(habit){ return !habit.archived; })
    .sort(function(a, b){ return a.order - b.order; });
}

/* マスの並び（重要）
   これはカレンダーではない。曜日は揃えない。
   左上が今日。右へ進むごとに1日ずつ過去へ、行末まで行ったら次の行の左端へ続く。
   i 番目のマス（0始まり、左上から右下へ）は 今日 - i 日。右下が34日前。 */
function buildDots(habit, base){
  const dots = document.createElement('div');
  dots.className = 'dots';

  for (let i = 0; i < DOT_COUNT; i++) {
    const key = dateKey(addDays(base, -i));

    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'dot';
    dot.dataset.date = key;
    dot.setAttribute('aria-label', formatDateJa(key));

    if (hasRecord(habit, key)) {
      dot.classList.add('is-done');
    } else if (i === 0) {
      /* 今日のマスに記録が無いとき … 塗りつぶさず、color の破線の枠 */
      dot.classList.add('is-today-open');
    }

    dots.appendChild(dot);
  }

  return dots;
}

function buildCard(habit, base){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.habitId = habit.id;
  card.style.setProperty('--habit-color', habit.color);

  card.appendChild(buildDots(habit, base));

  const count = document.createElement('div');
  count.className = 'count';
  count.textContent = '🔥 ' + totalDays(habit);
  card.appendChild(count);

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = habit.name;
  card.appendChild(name);

  return card;
}

function render(){
  const grid = document.getElementById('habit-grid');
  const empty = document.getElementById('empty-state');
  const habits = activeHabits();
  const base = today();

  grid.textContent = '';
  for (const habit of habits) grid.appendChild(buildCard(habit, base));

  grid.hidden = habits.length === 0;
  empty.hidden = habits.length > 0;
}

/* カード1枚だけを描き直す。
   ホーム画面に留まったまま更新するので、画面遷移は起こらない。 */
function refreshCard(card, habit){
  const base = today();
  const dots = card.querySelectorAll('.dot');

  for (let i = 0; i < dots.length; i++) {
    const key = dateKey(addDays(base, -i));
    const done = hasRecord(habit, key);
    dots[i].classList.toggle('is-done', done);
    dots[i].classList.toggle('is-today-open', !done && i === 0);
  }

  card.querySelector('.count').textContent = '🔥 ' + totalDays(habit);
}

function findHabit(id){
  for (const habit of state.habits) {
    if (habit.id === id) return habit;
  }
  return null;
}

/* =========================================================
   5節 「メモを追加」の帯
   記録が付いた直後に約4秒出る。押さなければ静かに消える。
   ========================================================= */

const BAND_MS = 4000;

let bandTarget = null;   /* { habitId, key } */
let bandTimer = null;

function showBand(habitId, key){
  /* 帯が出ている間に別のマスをタップしたら、対象を新しい記録に差し替える */
  bandTarget = { habitId: habitId, key: key };

  if (bandTimer !== null) clearTimeout(bandTimer);
  document.getElementById('memo-band').hidden = false;
  bandTimer = setTimeout(hideBand, BAND_MS);
}

function hideBand(){
  if (bandTimer !== null) {
    clearTimeout(bandTimer);
    bandTimer = null;
  }
  bandTarget = null;
  document.getElementById('memo-band').hidden = true;
}

/* =========================================================
   5節 メモ入力欄
   日付の見出し、複数行のテキスト欄、「完了」ボタン
   ========================================================= */

let memoTarget = null;     /* { habitId, key } */
let memoOpenedWith = '';   /* 開いたときのテキスト欄の内容 */

function openMemo(){
  if (bandTarget === null) return;

  const target = bandTarget;
  const habit = findHabit(target.habitId);

  hideBand();

  /* 帯を押すまでの間に記録が外されていたら開かない */
  if (habit === null || !hasRecord(habit, target.key)) return;

  memoTarget = target;
  document.getElementById('memo-title').textContent = formatDateJa(target.key);

  const text = document.getElementById('memo-text');
  text.value = habit.records[target.key];
  memoOpenedWith = text.value;

  document.getElementById('memo-sheet').hidden = false;
  text.focus();
}

function closeMemoSheet(){
  memoTarget = null;
  memoOpenedWith = '';
  document.getElementById('memo-sheet').hidden = true;
}

/* 「完了」以外で閉じるとき。
   開いたときの内容から変更されている場合だけ確認を出す。
   保存済みメモを開いて何も変えずに閉じるときは確認しない。 */
function cancelMemo(){
  if (memoTarget !== null && document.getElementById('memo-text').value !== memoOpenedWith) {
    const ok = window.confirm('書きかけのメモは保存されません。よろしいですか？');
    if (!ok) return;
  }
  closeMemoSheet();
}

/* 「完了」… メモを記録に書き込む */
function saveMemo(){
  if (memoTarget !== null) {
    const habit = findHabit(memoTarget.habitId);
    if (habit !== null && hasRecord(habit, memoTarget.key)) {
      habit.records[memoTarget.key] = document.getElementById('memo-text').value;
      saveState();
    }
  }
  closeMemoSheet();
}

/* =========================================================
   5節 マスのタップ
   その場で記録が付く／外れる。画面遷移は起こさない。
   ========================================================= */

function popDot(dot){
  dot.classList.remove('is-pop');
  void dot.offsetWidth;   /* アニメーションを再生し直すための reflow */
  dot.classList.add('is-pop');
}

function toggleRecord(habit, key, dot, card){
  if (hasRecord(habit, key)) {
    /* すでに記録がある日 … 記録が外れる（トグル）
       メモが入っている場合は、メモも消える旨を確認してから消す */
    const memo = habit.records[key];
    if (memo !== '') {
      const ok = window.confirm(
        formatDateJa(key) + ' の記録を外します。\n' +
        '書いたメモも一緒に消えます。よろしいですか？\n\n' + memo
      );
      if (!ok) return;
    }

    delete habit.records[key];
    saveState();
    refreshCard(card, habit);

    /* 記録を外したときは帯を出さない。
       いま出ている帯がこの記録を指していたら引っ込める */
    if (bandTarget !== null && bandTarget.habitId === habit.id && bandTarget.key === key) {
      hideBand();
    }
    return;
  }

  /* メモ無しは空文字 */
  habit.records[key] = '';
  saveState();
  refreshCard(card, habit);
  popDot(dot);
  showBand(habit.id, key);
}

document.getElementById('habit-grid').addEventListener('click', function(event){
  const dot = event.target.closest('.dot');
  if (dot === null) return;

  const card = dot.closest('.card');
  const habit = findHabit(card.dataset.habitId);
  if (habit === null) return;

  toggleRecord(habit, dot.dataset.date, dot, card);
});

document.getElementById('memo-band-button').addEventListener('click', openMemo);
document.getElementById('memo-done').addEventListener('click', saveMemo);

document.getElementById('memo-sheet').addEventListener('click', function(event){
  if (event.target.closest('[data-memo-cancel]') !== null) cancelMemo();
});

document.addEventListener('keydown', function(event){
  if (event.key === 'Escape' && !document.getElementById('memo-sheet').hidden) cancelMemo();
});

/* =========================================================
   8節 データのバックアップ
   ========================================================= */

function showImportMessage(text, ok){
  const message = document.getElementById('import-message');
  message.textContent = text;
  message.classList.toggle('is-ok', ok);
  message.classList.toggle('is-error', !ok);
  message.hidden = false;
}

/* 書き出し … 全データの JSON をテキスト欄に表示する。
   ファイルのダウンロードは使わない。 */
function openSettings(){
  hideBand();

  document.getElementById('export-text').value = JSON.stringify(state, null, 2);
  document.getElementById('import-text').value = '';
  document.getElementById('import-message').hidden = true;

  document.getElementById('home-view').hidden = true;
  document.getElementById('settings-view').hidden = false;
  window.scrollTo(0, 0);
}

function closeSettings(){
  document.getElementById('settings-view').hidden = true;
  document.getElementById('home-view').hidden = false;
  window.scrollTo(0, 0);
}

/* 読み込み … 貼り付けた JSON で全データを置き換える。
   受け付ける形式は2つ（normalizeState / normalizeRecords が両方を扱う）。
   壊れた JSON は「読み込めませんでした」と出して何も変更しない。 */
function runImport(){
  const raw = document.getElementById('import-text').value;

  /* 先に全部組み立てて、成功したときだけ差し替える。
     途中で失敗しても state には手を付けない。 */
  let next = null;
  try {
    next = normalizeState(JSON.parse(raw));
  } catch (e) {
    showImportMessage('読み込めませんでした', false);
    return;
  }

  if (state.habits.length > 0) {
    const ok = window.confirm(
      'いまのデータを、貼り付けた内容で全部置き換えます。\n' +
      'この操作は元に戻せません。よろしいですか？'
    );
    if (!ok) return;
  }

  state = next;
  saveState();
  render();

  const active = activeHabits().length;
  showImportMessage(
    state.habits.length + '件の習慣を読み込みました（稼働中 ' + active + '件）', true
  );
}

document.getElementById('open-settings').addEventListener('click', openSettings);
document.getElementById('close-settings').addEventListener('click', closeSettings);
document.getElementById('import-run').addEventListener('click', runImport);

document.getElementById('export-select').addEventListener('click', function(){
  const text = document.getElementById('export-text');
  text.focus();
  text.select();
});

/* 習慣の追加は 7節。実装の順番では 4 番目 */
document.getElementById('add-habit').addEventListener('click', function(){
  window.alert('習慣の追加はこれから実装します');
});

state = loadState();
render();
</script>
